          ctx.moveTo(0, 0);
          ctx.lineTo(-13, -78);
          ctx.moveTo(0, 0);
          ctx.lineTo(17, -75);
          ctx.stroke();
          ctx.strokeStyle = "rgba(255,255,255,.75)";
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(-1, -4);
          ctx.lineTo(-11, -72);
          ctx.moveTo(2, -4);
          ctx.lineTo(15, -69);
          ctx.stroke();
          ctx.fillStyle = "#53bbb7";
          ctx.beginPath();
          ctx.arc(-19, -98, 15, 0, Math.PI * 2);
          ctx.arc(22, -96, 15, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "rgba(238,247,247,.96)";
          ctx.beginPath();
          ctx.arc(-19, -98, 7, 0, Math.PI * 2);
          ctx.arc(22, -96, 7, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#8c9a9d";
          ctx.beginPath();
          ctx.arc(0, 0, 5, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          return;
        }

        if (style === "keyboard") {
          ctx.rotate(-.52);
          const body = ctx.createLinearGradient(-17, -112, 18, -20);
          body.addColorStop(0, "#313b3e");
          body.addColorStop(.48, "#66777a");
          body.addColorStop(1, "#20292b");
          roundRect(-17, -124, 34, 92, 12);
          ctx.fillStyle = body;
          ctx.fill();
          ctx.fillStyle = "#95e2d8";
          ctx.fillRect(-12, -105, 24, 7);
          ctx.shadowColor = "transparent";
          const nozzle = ctx.createLinearGradient(-12, -40, 12, 4);
          nozzle.addColorStop(0, "#b9c7c9");
          nozzle.addColorStop(1, "#56666a");
          ctx.fillStyle = nozzle;
          ctx.beginPath();
          ctx.moveTo(-12, -38);
          ctx.lineTo(12, -38);
          ctx.lineTo(7, 2);
          ctx.lineTo(-7, 2);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = "rgba(22,28,30,.8)";
          ctx.beginPath();
          ctx.ellipse(0, 2, 7, 3, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          return;
        }

        if (style === "woundBandage") {
          ctx.rotate(-.12);
          ctx.fillStyle = "rgba(255,245,225,.97)";
          ctx.shadowColor = "rgba(75,48,40,.2)";
          ctx.shadowBlur = 9;
          ctx.beginPath();
          ctx.ellipse(0, 0, 29, 22, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowColor = "transparent";
          ctx.strokeStyle = "rgba(219,191,160,.6)";
          ctx.lineWidth = 1;
          for (let i = -16; i <= 16; i += 5) {
            ctx.beginPath();
            ctx.moveTo(i, -14);
            ctx.lineTo(i + 4, 14);
            ctx.stroke();
          }
          ctx.restore();
          return;
        }

        if (style.includes("ear")) {
          ctx.rotate(-.6);
          const handle = ctx.createLinearGradient(-6, -120, 7, -10);
          handle.addColorStop(0, "#fff0bc");
          handle.addColorStop(.5, "#c99a35");
          handle.addColorStop(1, "#f4d984");
          roundRect(-6, -124, 12, 112, 6);
          ctx.fillStyle = handle;
          ctx.fill();
          ctx.shadowColor = "transparent";
          ctx.fillStyle = "#d9b24f";
          ctx.beginPath();
          ctx.ellipse(0, 0, 10, 15, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "rgba(255,244,195,.78)";
          ctx.beginPath();
          ctx.ellipse(-2, -3, 4, 7, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          return;
        }

        if (style.includes("teeth")) {
          ctx.rotate(-.62);
          const handle = ctx.createLinearGradient(-15, -120, 16, -12);
          handle.addColorStop(0, "#d5fff8");
          handle.addColorStop(.5, "#4fbdb8");
          handle.addColorStop(1, "#187f83");
          roundRect(-15, -126, 30, 111, 13);
          ctx.fillStyle = handle;
          ctx.fill();
          ctx.shadowColor = "transparent";
          ctx.fillStyle = "#f7fbfa";
          roundRect(-24, -15, 48, 26, 10);
          ctx.fill();
          ctx.strokeStyle = "#78d4ca";
          ctx.lineWidth = 2;
          for (let i = -17; i <= 17; i += 7) {
            ctx.beginPath();
            ctx.moveTo(i, 4);
            ctx.lineTo(i + Math.sin(state.time * .03 + i) * 2, 15);
            ctx.stroke();
          }
          ctx.restore();
          return;
        }

        if (state.level?.type === "slice") {
          const metal = ctx.createLinearGradient(-16, -80, 16, 56);
          metal.addColorStop(0, "#f2d28e");
          metal.addColorStop(.45, "#8d6b42");
          metal.addColorStop(1, "#f9e8b6");
          roundRect(-15, -120, 30, 150, 12);
          ctx.fillStyle = metal;
          ctx.fill();
          ctx.shadowColor = "transparent";
          ctx.fillStyle = "#283237";
          ctx.beginPath();
          ctx.moveTo(-30, 30);
          ctx.lineTo(30, 30);
          ctx.lineTo(12, 78);
          ctx.lineTo(-24, 70);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = "#d7b76b";
          ctx.beginPath();
          ctx.arc(0, 48, 8, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          return;
        }

        if (interaction === "pluck" || style.includes("wound") || style.includes("keyboard")) {
          ctx.rotate(.36);
          ctx.strokeStyle = "#dfe7e8";
          ctx.lineWidth = 8;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(-22, -96);
          ctx.lineTo(-5, 42);
          ctx.moveTo(22, -96);
          ctx.lineTo(5, 42);
          ctx.stroke();
          ctx.shadowColor = "transparent";
          ctx.strokeStyle = "#6f7f84";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-14, -60);
          ctx.lineTo(-4, 28);
          ctx.moveTo(14, -60);
          ctx.lineTo(4, 28);
          ctx.stroke();
          ctx.restore();
          return;
        }

        if (style.includes("glass") || style.includes("screen") || style.includes("tape")) {
          const handle = ctx.createLinearGradient(-20, -80, 20, 90);
          handle.addColorStop(0, "#bffff6");
          handle.addColorStop(.5, "#5ecac2");
          handle.addColorStop(1, "#278c91");
          roundRect(-18, -100, 36, 145, 14);
          ctx.fillStyle = handle;
          ctx.fill();
          ctx.shadowColor = "transparent";
          const blade = ctx.createLinearGradient(-62, 38, 62, 80);
          blade.addColorStop(0, "#f8fbfb");
          blade.addColorStop(.5, "#b7c6c8");
          blade.addColorStop(1, "#eef5f5");
          roundRect(-62, 34, 124, 34, 9);
          ctx.fillStyle = blade;
          ctx.fill();
          ctx.fillStyle = "rgba(255,255,255,.55)";
          ctx.fillRect(-50, 39, 100, 5);
          ctx.restore();
          return;
        }

        if (style.includes("hoof")) {
          const scraping = style === "hoof";
          const handle = ctx.createLinearGradient(-16, -122, 16, -12);
          handle.addColorStop(0, "#c78948");
          handle.addColorStop(1, "#6b432a");
          roundRect(-16, -126, 32, 116, 12);
          ctx.fillStyle = handle;
          ctx.fill();
          ctx.shadowColor = "transparent";
          const blade = ctx.createLinearGradient(-48, -14, 46, 22);
          blade.addColorStop(0, "#f5f8f7");
          blade.addColorStop(.46, "#9da9aa");
          blade.addColorStop(1, "#e5eceb");
          ctx.fillStyle = blade;
          ctx.beginPath();
          ctx.moveTo(-44, -13);
          ctx.lineTo(46, -13);
          ctx.lineTo(scraping ? 33 : 38, 20);
          ctx.lineTo(scraping ? -34 : -38, 20);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = "rgba(255,255,255,.78)";
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(-34, -8);
          ctx.lineTo(36, -8);
          ctx.stroke();
          ctx.strokeStyle = "rgba(52,59,60,.72)";
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(-33, 20);
          ctx.lineTo(32, 20);
          ctx.stroke();
          ctx.restore();
          return;
        }

        const gold = ctx.createLinearGradient(-12, -95, 12, 55);
        gold.addColorStop(0, "#ffe2a3");
        gold.addColorStop(.45, "#c88b2a");
        gold.addColorStop(1, "#fff1c8");
        roundRect(-12, -105, 24, 125, 11);
        ctx.fillStyle = gold;
        ctx.fill();
        ctx.shadowColor = "transparent";
        ctx.fillStyle = "#fafafa";
        ctx.beginPath();
        ctx.ellipse(0, 40, 25, 47, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,.8)";
        ctx.beginPath();
        ctx.ellipse(-8, 22, 9, 16, -.35, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawCare() {
        const d = state.data;
        drawCareSurface(d);
        if (interactiveOnlyStyles.has(d.careStyle)) drawInteractiveCareLayer(d);
        else drawDirtySceneLayer(d);
        if (d.interaction !== "scrub" || proceduralScrubStyles.has(d.careStyle)) {
          for (const item of d.items) drawCareItem(d, item);
        }
      }

      function drawTrails() {
        for (const trail of state.trails) {
          ctx.save();
          if (trail.clips?.length) {
            ctx.beginPath();
            for (const region of trail.clips) ctx.rect(region.x, region.y, region.w, region.h);
            ctx.clip();
          } else if (trail.clip) {
            roundRect(trail.clip.x, trail.clip.y, trail.clip.w, trail.clip.h, trail.clip.r);
            ctx.clip();
          }
          ctx.globalAlpha = Math.max(0, trail.life);
          ctx.strokeStyle = trail.color;
          ctx.lineWidth = trail.size;
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.shadowColor = "rgba(255,255,255,.55)";
          ctx.shadowBlur = 10;
          ctx.beginPath();
          ctx.moveTo(trail.px, trail.py);
          ctx.quadraticCurveTo((trail.px + trail.x) / 2, (trail.py + trail.y) / 2 - 4, trail.x, trail.y);
          ctx.stroke();
          ctx.globalAlpha = Math.max(0, trail.life * .55);
          ctx.fillStyle = "rgba(255,255,255,.85)";
          ctx.beginPath();
          ctx.ellipse(trail.x + Math.cos(trail.angle) * 9, trail.y - 7, trail.size * .15, trail.size * .06, trail.angle, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          trail.life -= .035;
        }
        state.trails = state.trails.filter(trail => trail.life > 0);
      }

      function drawParticles() {
        for (const p of state.particles) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.translate(p.x, p.y);
          if (p.r > 4.8) {
            ctx.strokeStyle = "rgba(255,255,255,.75)";
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.arc(0, 0, p.r, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = "rgba(255,255,255,.22)";
            ctx.beginPath();
            ctx.arc(0, 0, p.r * .82, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.fillStyle = p.color;
            ctx.beginPath();
            for (let i = 0; i < 4; i++) {
              const a = Math.PI / 4 + i * Math.PI / 2;
              const rr = p.r * (i % 2 ? .55 : 1.45);
              const x = Math.cos(a) * rr;
              const y = Math.sin(a) * rr;
              if (i === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fill();
          }
          ctx.restore();
          p.x += p.vx;
          p.y += p.vy;
          p.vy += .07;
          p.life -= .025;
        }
        state.particles = state.particles.filter(p => p.life > 0);

        for (const t of state.texts) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, t.life);
          ctx.fillStyle = t.color;
          ctx.font = "900 24px Inter, system-ui, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(t.text, t.x, t.y);
          ctx.restore();
          t.y -= 1.8;
          t.life -= .025;
        }
        state.texts = state.texts.filter(t => t.life > 0);
      }

      function drawPlayfieldFrame() {
        const layout = getLayoutMetrics();
        const pad = state.compactLandscape ? 10 : 18;
        const y = Math.max(6, layout.workY - (state.compactLandscape ? 5 : 10));
        const h = Math.max(80, state.height - y - layout.bottomReserved + 7);
        ctx.save();
        ctx.strokeStyle = "rgba(37,48,51,.08)";
        ctx.lineWidth = 1;
        roundRect(pad, y, state.width - pad * 2, h, 8);
        ctx.stroke();
        ctx.restore();
      }

      function tick(now) {
        if (document.hidden) {
          state.lastFrameAt = now;
          requestAnimationFrame(tick);
          return;
        }
        const effectsActive = state.pointer.down || state.particles.length || state.texts.length || state.trails.length;
        const targetFps = state.scene === "start"
          ? 24
          : coarsePointer
            ? (effectsActive ? (lowPowerDevice ? 40 : 50) : (lowPowerDevice ? 22 : 28))
            : (effectsActive ? 60 : 45);
        const frameInterval = 1000 / targetFps;
        const elapsedSinceFrame = now - state.lastFrameAt;
        if (state.lastFrameAt && elapsedSinceFrame < frameInterval - .75) {
          state.framesSkipped++;
          requestAnimationFrame(tick);
          return;
        }
        state.lastFrameAt = state.lastFrameAt && elapsedSinceFrame < frameInterval * 4
          ? now - (elapsedSinceFrame % frameInterval)
          : now;
        state.framesRendered++;
        const delta = state.time ? Math.min(50, now - state.time) : 16;
        state.time = now;
        updateCareHold(delta);
        updateHud();
        drawBackground();
        if (state.scene === "play" || state.scene === "finish") {
          drawPlayfieldFrame();
          if (state.level?.type === "clean") drawClean();
          if (state.level?.type === "pop") drawPop();
          if (state.level?.type === "slice") drawSlice();
          if (state.level?.type === "sort") drawSort();
          if (state.level?.type === "care") drawCare();
        } else {
          drawAttract();
        }
        drawTrails();
        drawCareTool();
        drawParticles();
        requestAnimationFrame(tick);
      }

      function drawAttract() {
        const cx = state.width / 2;
        const cy = state.height * .47;
        const colors = ["#a7ddd0", "#ffc857", "#ff8b7b", "#7a5c9d"];
        for (let i = 0; i < 4; i++) {
          ctx.save();
          ctx.translate(cx + Math.cos(state.time * .001 + i) * 78, cy + Math.sin(state.time * .0013 + i) * 28);
          ctx.rotate(Math.sin(state.time * .001 + i) * .3);
          ctx.shadowColor = "rgba(37,48,51,.14)";
          ctx.shadowBlur = 20;
          ctx.shadowOffsetY = 12;
          roundRect(-38, -38, 76, 76, i === 3 ? 30 : 18);
          ctx.fillStyle = colors[i];
          ctx.fill();
          ctx.shadowColor = "transparent";
          ctx.fillStyle = "rgba(255,255,255,.42)";
          ctx.beginPath();
          ctx.ellipse(-10, -13, 19, 7, -.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      function startGame() {
        unlockAudio(true);
        startOverlay.classList.add("hidden");
        finishOverlay.classList.add("hidden");
        buildLevel(state.levelIndex, false);
      }

      document.getElementById("startBtn").addEventListener("click", startGame);
      startFirstBtn.addEventListener("click", () => {
        unlockAudio(true);
        state.levelIndex = 0;
        startOverlay.classList.add("hidden");
        finishOverlay.classList.add("hidden");
        buildLevel(0, false);
        save();
        tone(480, .07, "triangle", .045);
      });
      nextBtn.addEventListener("click", () => {
        unlockAudio(true);
        finishOverlay.classList.add("hidden");
        state.levelIndex = state.levelIndex >= totalLevels - 1 ? 0 : state.levelIndex + 1;
        buildLevel(state.levelIndex, false);
        save();
      });
      document.getElementById("replayBtn").addEventListener("click", () => {
        unlockAudio(true);
        finishOverlay.classList.add("hidden");
        buildLevel(state.levelIndex, false);
      });
      homeBtn.addEventListener("click", () => {
        if (state.scene !== "play" || state.completed) return;
        unlockAudio(true);
        stopToolLoop();
        cancelIdlePreload();
        state.pointer.down = false;
        state.pointerId = null;
        state.scene = "start";
        state.level = null;
        state.data = null;
        finishOverlay.classList.add("hidden");
        startOverlay.classList.remove("hidden");
        scheduleHomeLevelWarmup();
        save();
        updateHud();
        tone(360, .06, "sine", .04);
      });
      previousBtn.addEventListener("click", () => {
        if (state.scene !== "play" || state.completed || state.levelIndex <= 0) return;
        resetLevelActionStyles(previousBtn);
        unlockAudio(true);
        stopToolLoop();
        finishOverlay.classList.add("hidden");
        state.levelIndex -= 1;
        buildLevel(state.levelIndex, false);
        save();
        tone(420, .06, "sine", .045);
      });
      skipBtn.addEventListener("click", () => {
        if (state.scene !== "play" || state.completed || state.adPending) return;
        unlockAudio(true);
        if (tapAds.isTapRuntime()) {
          runRewardedAction("skipLevel", skipCurrentLevel);
        } else {
          skipCurrentLevel();
        }
      });
      rewardAdBtn.addEventListener("click", () => {
        if (state.scene !== "finish" || state.rewardDoubled || state.adPending) return;
        unlockAudio(true);
        runRewardedAction("doubleCoins", doubleLastReward);
      });
      restartBtn.addEventListener("click", () => {
        if (state.scene !== "play" || state.completed) return;
        resetLevelActionStyles(restartBtn);
        unlockAudio(true);
        stopToolLoop();
        finishOverlay.classList.add("hidden");
        buildLevel(state.levelIndex, false);
        save();
        tone(520, .055, "triangle", .045);
      });
      document.getElementById("resetBtn").addEventListener("click", () => {
        localStorage.removeItem(storageKey);
        state.coins = 0;
        state.levelIndex = 0;
        state.streak = 0;
        save();
        updateHud();
        tone(300, .08, "triangle", .06);
      });
      document.getElementById("soundBtn").addEventListener("click", () => {
        state.soundOn = !state.soundOn;
        if (state.soundOn) unlockAudio(true);
        else stopToolLoop();
        save();
        updateHud();
      });

      const primeAudioFromGesture = () => {
        if (state.soundOn) unlockAudio(false);
      };
      document.addEventListener("pointerdown", primeAudioFromGesture, { capture: true, passive: true });
      document.addEventListener("touchstart", primeAudioFromGesture, { capture: true, passive: true });
      document.addEventListener("keydown", primeAudioFromGesture, { capture: true, passive: true });

      const activeInputOptions = { passive: false };
      if (window.PointerEvent) {
        canvas.addEventListener("pointerdown", onPointerDown, activeInputOptions);
        canvas.addEventListener("pointermove", onPointerMove, activeInputOptions);
        canvas.addEventListener("pointerup", onPointerUp, activeInputOptions);
        canvas.addEventListener("pointercancel", onPointerUp, activeInputOptions);
        window.addEventListener("pointerup", onPointerUp, activeInputOptions);
        window.addEventListener("pointercancel", onPointerUp, activeInputOptions);
      } else {
        canvas.addEventListener("mousedown", onMouseDown, activeInputOptions);
        window.addEventListener("mousemove", onMouseMove, activeInputOptions);
        window.addEventListener("mouseup", onMouseUp, activeInputOptions);
        canvas.addEventListener("touchstart", onTouchStart, activeInputOptions);
        canvas.addEventListener("touchmove", onTouchMove, activeInputOptions);
        canvas.addEventListener("touchend", onTouchEnd, activeInputOptions);
        canvas.addEventListener("touchcancel", onTouchEnd, activeInputOptions);
      }
      const preventNativeGesture = event => {
        if (event.cancelable) event.preventDefault();
      };
      document.addEventListener("contextmenu", preventNativeGesture, activeInputOptions);
      document.addEventListener("selectstart", preventNativeGesture, activeInputOptions);
      document.addEventListener("dragstart", preventNativeGesture, activeInputOptions);
      document.addEventListener("gesturestart", preventNativeGesture, activeInputOptions);
      let resizeTimer = 0;
      function scheduleResize(delay = 90) {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(resize, delay);
      }
      window.addEventListener("resize", () => scheduleResize());
      window.addEventListener("orientationchange", () => scheduleResize(140));
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          stopToolLoop();
          if (state.audio?.state === "running") state.audio.suspend();
        }
      });

      if (new URLSearchParams(window.location.search).has("asmr-test")) {
        window.__asmrTest = {
          state,
          diagnostics: () => ({
            dpr: state.dpr,
            renderedFrames: state.framesRendered,
            skippedFrames: state.framesSkipped,
            loadedSceneImages: levelImageAssets.reduce((count, pair) => count
              + Number(Boolean(pair.clean)) + Number(Boolean(pair.dirty)), 0),
            loadedTools: Object.keys(toolAssets).length,
            backgroundPixels: backgroundCache.width * backgroundCache.height,
            canvasPixels: canvas.width * canvas.height,
            revealVersion: state.data?.revealVersion || 0,
            revealCompositeVersion: state.data?.revealCompositeVersion || 0
          })
        };
        const testProbe = document.createElement("button");
        testProbe.id = "asmrTestProbe";
        testProbe.type = "button";
        testProbe.setAttribute("aria-label", "test probe");
        testProbe.style.cssText = "position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;z-index:9999;padding:0;border:0";
        testProbe.addEventListener("click", () => {
          const data = state.data || {};
          document.documentElement.setAttribute("data-asmr-test", JSON.stringify({
            scene: state.scene,
            levelIndex: state.levelIndex,
            progress: state.progress,
            completed: state.completed,
            area: data.area || data.rect || null,
            items: data.items?.map(item => ({
              x: item.x, y: item.y, baseX: item.baseX, baseY: item.baseY,
              r: item.r, done: item.done, progress: item.progress
            })) || [],
            guides: data.guides?.map(guide => ({ ...guide })) || []
          }));
        });
        document.body.appendChild(testProbe);
      }

      loadSave();
      resize();
      updateHud();
      scheduleHomeLevelWarmup();
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
