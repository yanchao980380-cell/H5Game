        showAdNotice("广告加载中，请稍候", 60000);
        state.hudSignature = "";
        updateHud();
        tapAds.show(slot).then(result => {
            state.adPending = false;
          state.adNotice = "";
          state.adNoticeUntil = 0;
          if (result?.ok) {
            onReward();
          } else {
            const message = result?.reason === "closed_early"
              ? "广告未看完，本次不发放奖励"
              : getAdFailureMessage(result);
            showAdNotice(message, 4200);
            updateHud();
          }
        }).catch(error => {
          state.adPending = false;
          state.adNotice = "";
          state.adNoticeUntil = 0;
          showAdNotice(`广告播放失败：${compactAdErrorText({ errorMessage: error }) || "未知错误"}`, 4200);
          updateHud();
        });
        return true;
      }

      function skipCurrentLevel() {
        if (state.scene !== "play" || state.completed || state.adPending) return;
        resetLevelActionStyles(skipBtn);
        unlockAudio(true);
        resetInputAfterAd();
        finishOverlay.classList.add("hidden");
        if (state.levelIndex >= totalLevels - 1) {
          cancelIdlePreload();
          state.levelIndex = 0;
          state.scene = "start";
          state.level = null;
          state.data = null;
          startOverlay.classList.remove("hidden");
          scheduleHomeLevelWarmup();
          updateHud();
        } else {
          state.levelIndex += 1;
          buildLevel(state.levelIndex, false);
        }
        save();
        tone(620, .065, "triangle", .045);
      }

      function doubleLastReward() {
        if (state.scene !== "finish" || !state.lastReward || state.rewardDoubled) return;
        state.coins += state.lastReward;
        state.rewardDoubled = true;
        rewardCoinsEl.textContent = `+${state.lastReward * 2}`;
        finishMessageEl.textContent = "奖励已翻倍，继续保持这份爽感";
        showAdNotice("金币已翻倍");
        save();
        updateHud();
      }

      function updateHud() {
        const comboOn = performance.now() < state.comboUntil && state.combo > 1;
        if (state.adNotice && performance.now() > state.adNoticeUntil) state.adNotice = "";
        const skipUsesAd = tapAds.canUse("skipLevel");
        const doubleUsesAd = tapAds.canUse("doubleCoins");
        const adsAllowed = adsAllowedForCurrentProgress();
        const toolKey = state.level ? getActiveToolKey() : "";
        const signature = [
          Math.floor(state.coins), state.scene, state.levelIndex,
          Math.round(clamp(state.progress, 0, 1) * 100), state.combo,
          comboOn, state.soundOn, state.hasInteracted, state.completed, toolKey,
          state.adPending, state.rewardDoubled, state.lastReward, state.adNotice,
          skipUsesAd, doubleUsesAd, adsAllowed
        ].join("|");
        if (signature === state.hudSignature) return;
        state.hudSignature = signature;
        coinsEl.textContent = Math.floor(state.coins);
        levelTitleEl.textContent = state.scene === "play" && state.level
          ? state.level.name
          : "准备开工";
        meter.style.width = `${Math.round(clamp(state.progress, 0, 1) * 100)}%`;
        levelHintEl.textContent = state.adNotice || (state.scene === "play" && state.level ? state.level.hint : "");
        levelHintEl.classList.toggle("subdued", !state.adNotice && (state.hasInteracted || state.progress > 0));
        levelHintEl.classList.toggle("ad-state", Boolean(state.adNotice));
        comboEl.textContent = `x${state.combo}`;
        startBtnLabel.textContent = state.levelIndex > 0 ? "继续上次进度" : "开始解压";
        startFirstBtn.hidden = state.levelIndex <= 0;
        const controlsLocked = state.scene !== "play" || state.completed || state.adPending;
        const isFirstLevel = state.levelIndex <= 0;
        previousBtn.hidden = isFirstLevel;
        previousBtn.disabled = controlsLocked || isFirstLevel;
        homeBtn.disabled = controlsLocked;
        skipBtnLabel.textContent = state.adPending
          ? "广告加载中"
          : tapAds.isTapRuntime()
            ? skipUsesAd ? "看视频跳过" : "广告暂不可用"
            : "跳过此关";
        skipBtn.disabled = controlsLocked || !adsAllowed;
        restartBtn.disabled = controlsLocked;
        rewardAdBtn.hidden = !(state.scene === "finish" && doubleUsesAd && adsAllowed && state.lastReward > 0);
        rewardAdBtn.disabled = state.adPending || state.rewardDoubled;
        rewardAdBtn.textContent = state.adPending ? "广告加载中" : state.rewardDoubled ? "已翻倍领取" : "看视频，金币翻倍";
        if (state.level) updateToolPreview();
        comboEl.classList.toggle("on", comboOn);
        soundIcon.innerHTML = state.soundOn
          ? '<path d="M11 5 6 9H3v6h3l5 4V5Z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path>'
          : '<path d="M11 5 6 9H3v6h3l5 4V5Z"></path><path d="m22 9-6 6"></path><path d="m16 9 6 6"></path>';
      }

      let controlResetTimer = 0;
      function resetLevelActionStyles(trigger) {
        trigger?.blur();
        if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
        clearTimeout(controlResetTimer);
        levelActionsEl.classList.add("is-resetting");
        state.hudSignature = "";
        controlResetTimer = setTimeout(() => levelActionsEl.classList.remove("is-resetting"), 72);
      }

      function placeGesture() {
        if (!state.level || state.scene !== "play") {
          gestureEl.classList.add("hidden");
          return;
        }
        const d = state.data;
        gestureEl.classList.toggle("vertical", d.scrubAxis === "vertical");
        gestureEl.classList.toggle("hold", d.interaction === "hold");
        gestureEl.classList.remove("hidden");
        const handleReach = coarsePointer ? getTouchToolReach() : 0;
        const placeAt = (x, y) => {
          gestureEl.style.left = `${clamp(x - 17, 4, state.width - 38)}px`;
          gestureEl.style.top = `${clamp(y + handleReach - 17, 4, state.height - 42)}px`;
        };
        if (state.level.type === "clean" || state.level.type === "slice") {
          const rect = d.rect;
          placeAt(rect.x + rect.w / 2, rect.y + rect.h * .55);
        } else if (state.level.type === "pop") {
          const b = d.bubbles[Math.floor(d.bubbles.length / 2)];
          placeAt(b.x, b.y);
        } else if (state.level.type === "care") {
          const item = d.items.find(part => !part.done) || d.items[0];
          placeAt(item.x, item.y);
        } else {
          const item = d.items[0];
          placeAt(item.x + item.w / 2, item.y + item.h / 2);
        }
      }

      function unlockAudio(ping) {
        if (!state.soundOn) return null;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return null;
        if (state.audio?.state === "closed") {
          state.audio = null;
          state.masterGain = null;
          state.compressor = null;
          state.noiseBuffer = null;
          state.audioReady = false;
        }
        if (!state.audio) {
          try {
            state.audio = new AudioCtx({ latencyHint: "interactive" });
          } catch (_) {
            state.audio = new AudioCtx();
          }
          state.masterGain = state.audio.createGain();
          state.compressor = state.audio.createDynamicsCompressor();
          state.masterGain.gain.value = .82;
          state.compressor.threshold.value = -20;
          state.compressor.knee.value = 18;
          state.compressor.ratio.value = 4;
          state.compressor.attack.value = .004;
          state.compressor.release.value = .18;
          state.masterGain.connect(state.compressor).connect(state.audio.destination);

          const seconds = 2;
          state.noiseBuffer = state.audio.createBuffer(1, state.audio.sampleRate * seconds, state.audio.sampleRate);
          const samples = state.noiseBuffer.getChannelData(0);
          let brown = 0;
          for (let i = 0; i < samples.length; i++) {
            const white = Math.random() * 2 - 1;
            brown = (brown + .025 * white) / 1.025;
            samples[i] = white * .72 + brown * 2.4;
          }
        }

        if (!state.audioReady || state.audio.state !== "running") {
          try {
            const source = state.audio.createBufferSource();
            source.buffer = state.audio.createBuffer(1, 1, 22050);
            source.connect(state.audio.destination);
            source.start(0);
          } catch (_) {}
        }

        const ready = () => {
          state.audioReady = state.audio?.state === "running";
          if (!ping || !state.audioReady) return;
          const now = performance.now();
          if (now - state.lastUnlockPing < 260) return;
          state.lastUnlockPing = now;
          toneSweep(510, 390, .07, "sine", .06, 0, -.18);
          toneSweep(760, 610, .085, "sine", .048, .045, .18);
        };

        if (state.audio.state !== "running") {
          try {
            const resume = state.audio.resume();
            if (resume && typeof resume.then === "function") resume.then(ready).catch(() => {});
            else ready();
          } catch (_) {}
        } else {
          ready();
        }
        return state.audio;
      }

      function routeAudio(node, pan = 0) {
        if (!state.audio || !state.masterGain) return;
        if (typeof state.audio.createStereoPanner === "function") {
          const panner = state.audio.createStereoPanner();
          panner.pan.value = clamp(pan, -1, 1);
          node.connect(panner).connect(state.masterGain);
        } else {
          node.connect(state.masterGain);
        }
      }

      function toneSweep(startFreq, endFreq, duration, type, gainValue, delay = 0, pan = 0) {
        if (!state.soundOn || !state.audio) return;
        const now = state.audio.currentTime + delay;
        const osc = state.audio.createOscillator();
        const gain = state.audio.createGain();
        osc.type = type || "sine";
        osc.frequency.setValueAtTime(Math.max(20, startFreq), now);
        osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), now + duration);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(gainValue || .08, now + Math.min(.012, duration * .2));
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
        osc.connect(gain);
        routeAudio(gain, pan);
        osc.start(now);
        osc.stop(now + duration + .02);
      }

      function tone(freq, duration, type, gainValue) {
        toneSweep(freq, Math.max(20, freq * .58), duration, type, gainValue, 0, (Math.random() - .5) * .34);
      }

      function filteredNoise(duration, filterType, filterFreq, q, gainValue, attack = .004, delay = 0, pan = 0) {
        if (!state.soundOn || !state.audio || !state.noiseBuffer) return;
        const now = state.audio.currentTime + delay;
        const src = state.audio.createBufferSource();
        const filter = state.audio.createBiquadFilter();
        const gain = state.audio.createGain();
        src.buffer = state.noiseBuffer;
        filter.type = filterType || "bandpass";
        filter.frequency.value = filterFreq;
        filter.Q.value = q || .8;
        gain.gain.setValueAtTime(.0001, now);
        gain.gain.exponentialRampToValueAtTime(Math.max(.0002, gainValue), now + Math.min(attack, duration * .35));
        gain.gain.exponentialRampToValueAtTime(.0001, now + duration);
        src.connect(filter).connect(gain);
        routeAudio(gain, pan);
        const maxOffset = Math.max(0, state.noiseBuffer.duration - duration - .01);
        src.start(now, Math.random() * maxOffset);
        src.stop(now + duration + .02);
      }

      function noise(duration, filterFreq, gainValue) {
        filteredNoise(duration, "bandpass", filterFreq, .9, gainValue, .003, 0, (Math.random() - .5) * .55);
      }

      function haptic(ms) {
        const now = performance.now();
        const minimumGap = lowPowerDevice ? 78 : coarsePointer ? 54 : 42;
        if (now - state.lastHaptic < minimumGap) return;
        state.lastHaptic = now;
        if (navigator.vibrate) navigator.vibrate(ms);
      }

      function playAction(type) {
        unlockAudio();
        const style = state.level?.careStyle || state.level?.sliceStyle || "";
        const pan = (Math.random() - .5) * .55;
        if (type === "contact") {
          const now = performance.now();
          if (now - state.lastContact < (lowPowerDevice ? 82 : coarsePointer ? 68 : 58)) return;
          state.lastContact = now;
          filteredNoise(.032, "highpass", style.includes("glass") ? 1900 : 1100, .7, .028, .001, 0, pan);
          toneSweep(style.includes("glass") ? 1180 : 480, style.includes("glass") ? 900 : 250, .035, "triangle", .025, 0, pan);
        }
        if (type === "pop") {
          toneSweep(195 + Math.random() * 28, 72, .135, "sine", .15, 0, pan);
          filteredNoise(.075, "lowpass", 980, .75, .07, .002, .012, pan);
          toneSweep(760 + Math.random() * 120, 1120, .048, "sine", .042, .025, -pan);
          haptic(8);
        }
        if (type === "clean") {
          const now = performance.now();
          const rubInterval = lowPowerDevice ? 82 : coarsePointer ? 66 : 56;
          if (now - state.lastRub > rubInterval) {
            state.lastRub = now;
            if (style.includes("hoof")) {
              filteredNoise(.105, "bandpass", 360 + Math.random() * 210, 1.25, .085, .006, 0, pan);
              filteredNoise(.046, "highpass", 2100, .55, .025, .001, .01, -pan);
              if (Math.random() > .66) toneSweep(150, 92, .055, "triangle", .028, 0, pan);
            } else if (style.includes("glass")) {
              filteredNoise(.095, "highpass", 1700 + Math.random() * 520, .72, .048, .004, 0, pan);
              if (Math.random() > .58) toneSweep(1450 + Math.random() * 260, 1180, .06, "sine", .023, .005, -pan);
            } else if (style.includes("teeth")) {
              filteredNoise(.065, "highpass", 2250, .8, .027, .003, 0, pan);
              if (Math.random() > .7) toneSweep(2480, 2050, .045, "sine", .018, 0, -pan);
            } else if (style.includes("screen")) {
              filteredNoise(.09, "bandpass", 760 + Math.random() * 260, 1.05, .045, .006, 0, pan);
              if (Math.random() > .72) toneSweep(920, 690, .058, "sine", .019, 0, -pan);
            } else if (style.includes("tape")) {
              filteredNoise(.12, "bandpass", 540, 1.3, .065, .004, 0, pan);
              if (Math.random() > .62) toneSweep(255, 130, .075, "triangle", .035, 0, -pan);
            } else if (style.includes("ear")) {
              filteredNoise(.064, "highpass", 1850 + Math.random() * 620, .68, .028, .003, 0, pan);
            } else {
              filteredNoise(.078, "bandpass", 900 + Math.random() * 650, .9, .052, .004, 0, pan);
            }
            haptic(4);
          }
        }
        if (type === "slice") {
          filteredNoise(.19, "highpass", 2050, 1.05, .085, .003, 0, pan);
          toneSweep(1640 + Math.random() * 220, 980, .16, "sine", .052, 0, pan);
          toneSweep(2380, 1760, .075, "triangle", .022, .045, -pan);
          filteredNoise(.055, "bandpass", 520, 1.4, .045, .002, .09, 0);
          haptic(12);
        }
        if (type === "sort") {
          tone(460, .075, "triangle", .11);
          tone(720, .07, "sine", .06);
          haptic(10);
        }
        if (type === "care") {
          if (style === "pimple" || style === "pimpleMask") {
            toneSweep(180 + Math.random() * 25, 68, .14, "sine", .13, 0, pan);
            filteredNoise(.075, "lowpass", 850, .8, .058, .002, .008, pan);
            toneSweep(680, 960, .045, "sine", .025, .028, -pan);
          } else if (style.includes("nose") || style === "splinter") {
            toneSweep(1080 + Math.random() * 220, 1560, .052, "triangle", .06, 0, pan);
            filteredNoise(.038, "highpass", 2800, .65, .034, .001, .006, -pan);
            toneSweep(285, 105, .095, "sine", .065, .022, 0);
          } else if (style.includes("wound")) {
            toneSweep(1680, 1120, .04, "triangle", .04, 0, pan);
            filteredNoise(.06, "bandpass", 720, 1, .03, .002, .015, -pan);
          } else if (style === "keyboard") {
            toneSweep(650 + Math.random() * 360, 330, .045, "triangle", .038, 0, pan);
            filteredNoise(.045, "highpass", 1450, .8, .023, .001, 0, -pan);
          } else {
            filteredNoise(.085, "bandpass", 1100 + Math.random() * 650, .9, .052, .003, 0, pan);
            toneSweep(520 + Math.random() * 180, 310, .06, "triangle", .032, 0, -pan);
          }
          haptic(8);
        }
        if (type === "miss") {
          const now = performance.now();
          if (now - state.lastContact < 90) return;
          state.lastContact = now;
          filteredNoise(.035, "lowpass", 540, .8, .014, .002, 0, 0);
        }
        if (type === "release" && style && !state.completed) {
          filteredNoise(.045, "highpass", 1350, .65, .018, .002, 0, pan);
          toneSweep(390, 250, .045, "sine", .014, 0, -pan);
        }
        if (type === "complete") {
          toneSweep(420, 520, .22, "sine", .095, 0, -.3);
          toneSweep(620, 760, .24, "sine", .085, .075, .3);
          toneSweep(820, 1080, .32, "sine", .1, .16, 0);
          filteredNoise(.3, "highpass", 3100, .55, .026, .025, .12, 0);
          haptic([20, 40, 25]);
        }
      }

      function startToolLoop() {
        stopToolLoop();
        if (!state.soundOn || !state.audio || !state.noiseBuffer) return;
        const style = state.level?.careStyle || "";
        const interaction = state.level?.interaction;
        if (interaction !== "scrub" && interaction !== "hold" && style !== "keyboard") return;
        const now = state.audio.currentTime;
        const output = state.audio.createGain();
        const texture = state.audio.createBufferSource();
        const filter = state.audio.createBiquadFilter();
        const nodes = [texture];
        texture.buffer = state.noiseBuffer;
        texture.loop = true;
        filter.type = style.includes("glass") ? "highpass" : style.includes("hoof") || style.includes("tape") ? "bandpass" : "lowpass";
        filter.frequency.value = style.includes("glass") ? 2100 : style.includes("hoof") ? 480 : style.includes("tape") ? 650 : style.includes("teeth") ? 1450 : style === "keyboard" ? 720 : 1100;
        filter.Q.value = style.includes("hoof") || style.includes("tape") ? 1.2 : .7;
        texture.connect(filter).connect(output);

        if (style.includes("teeth") || style === "keyboard") {
          const motor = state.audio.createOscillator();
          const motorFilter = state.audio.createBiquadFilter();
          motor.type = style === "keyboard" ? "sawtooth" : "triangle";
          motor.frequency.value = style === "keyboard" ? 68 : 118;
          motorFilter.type = "lowpass";
          motorFilter.frequency.value = style === "keyboard" ? 520 : 840;
          motor.connect(motorFilter).connect(output);
          motor.start(now);
          nodes.push(motor);
        }

        output.gain.setValueAtTime(.0001, now);
        const target = style.includes("hoof") ? .022 : style.includes("glass") ? .012 : style.includes("teeth") || style === "keyboard" ? .015 : .009;
        output.gain.exponentialRampToValueAtTime(target, now + .055);
        routeAudio(output, 0);
        texture.start(now, Math.random() * Math.max(.01, state.noiseBuffer.duration - .1));
        state.toolLoop = { nodes, output };
      }

      function stopToolLoop() {
        const loop = state.toolLoop;
        if (!loop || !state.audio) return;
        const now = state.audio.currentTime;
        loop.output.gain.cancelScheduledValues(now);
        loop.output.gain.setValueAtTime(Math.max(.0001, loop.output.gain.value), now);
        loop.output.gain.exponentialRampToValueAtTime(.0001, now + .075);
        for (const node of loop.nodes) {
          try { node.stop(now + .09); } catch (_) {}
        }
        state.toolLoop = null;
      }

      function bumpCombo(x, y) {
        const now = performance.now();
        state.combo = now - state.lastAction < 800 ? clamp(state.combo + 1, 1, 9) : 1;
        state.lastAction = now;
        state.comboUntil = now + 900;
        if (state.combo > 2 && x && y) {
          state.texts.push({ x, y, text: `x${state.combo}`, life: 1, color: "#253033" });
        }
      }

      function addParticles(x, y, color, count, power) {
        for (let i = 0; i < count; i++) {
          const a = Math.random() * Math.PI * 2;
          const s = lerp(.8, power || 5, Math.random());
          state.particles.push({
            x, y,
            vx: Math.cos(a) * s,
            vy: Math.sin(a) * s - Math.random() * 2,
            r: lerp(2, 6, Math.random()),
            life: 1,
            color
          });
        }
        if (state.particles.length > 160) state.particles.splice(0, state.particles.length - 160);
      }

      function addTrail(x, y, color, size, life) {
        const bounds = state.level?.type === "care" ? (state.data?.cleanBounds || state.data?.area) : null;
        const regions = state.level?.type === "care" ? state.data?.cleanRegions : null;
        state.trails.push({
          x,
          y,
          px: state.pointer.lastX || x,
          py: state.pointer.lastY || y,
          color,
          size: size || 24,
          life: life || 1,
          angle: Math.random() * Math.PI,
          clip: bounds ? { x: bounds.x, y: bounds.y, w: bounds.w, h: bounds.h, r: bounds.r || 0 } : null,
          clips: regions?.map(region => ({ ...region })) || null
        });
        if (state.trails.length > 90) state.trails.splice(0, state.trails.length - 90);
      }

      function showCelebration(isFinalLevel) {
        celebrationLabel.textContent = isFinalLevel ? "全关通关" : "清理完成";
        celebrationLayer.querySelectorAll(".confetti-piece").forEach(piece => piece.remove());
        const colors = ["#ffc857", "#ff8b7b", "#65bfc1", "#7a5c9d", "#a7ddd0"];
        for (let i = 0; i < 28; i++) {
          const piece = document.createElement("i");
          piece.className = "confetti-piece";
          const angle = Math.PI * 2 * i / 28 + (i % 3) * .08;
          const distance = Math.min(state.width, state.height) * (.28 + i % 5 * .025);
          piece.style.setProperty("--x", `${Math.cos(angle) * distance}px`);
          piece.style.setProperty("--y", `${Math.sin(angle) * distance - distance * .12}px`);
          piece.style.setProperty("--r", `${240 + i * 29}deg`);
          piece.style.background = colors[i % colors.length];
          piece.style.animationDelay = `${(i % 7) * 18}ms`;
          celebrationLayer.appendChild(piece);
        }
        celebrationLayer.classList.remove("hidden");
        void celebrationLayer.offsetWidth;
        celebrationLayer.classList.add("play");
      }

      function completeLevel() {
        if (state.completed) return;
        state.completed = true;
        state.completedAt = performance.now();
        const completionToken = ++state.completionToken;
        state.progress = 1;
        clearRevealLayer(state.data);
        stopToolLoop();
        updateHud();
        playAction("complete");
        addParticles(state.width / 2, state.height * .4, "#ffc857", 44, 8);
        const isFinalLevel = state.levelIndex >= totalLevels - 1;
        showCelebration(isFinalLevel);
        setTimeout(() => {
          if (!state.completed || completionToken !== state.completionToken) return;
          const bonus = Math.max(0, state.combo - 1) * 3;
          const reward = 35 + bonus + Math.floor(state.levelIndex / 4) * 5;
          state.lastReward = reward;
          state.rewardDoubled = false;
          state.coins += reward;
          state.streak += 1;
          const titles = ["很解压", "极度舒适", "完美治愈", "爽感爆表"];
          finishTitleEl.textContent = isFinalLevel
            ? "新一轮爽感已就绪"
            : titles[Math.min(titles.length - 1, Math.floor((state.combo + state.streak % 4) / 3))];
          finishMessageEl.textContent = isFinalLevel
            ? "更多清理委托已经准备好了。"
            : "本次清理完成";
          nextBtn.textContent = isFinalLevel ? "继续解压" : "下一关";
          rewardCoinsEl.textContent = `+${reward}`;
          rewardComboEl.textContent = `x${Math.max(1, state.combo)}`;
          rewardStreakEl.textContent = String(state.streak);
          starsEl.innerHTML = "";
          const starCount = state.combo >= 4 ? 3 : state.combo >= 2 ? 2 : 1;
          for (let i = 0; i < 3; i++) {
            const star = document.createElement("i");
            star.className = `star${i < starCount ? " on" : ""}`;
            starsEl.appendChild(star);
          }
          celebrationLayer.classList.add("hidden");
          celebrationLayer.classList.remove("play");
          state.scene = "finish";
          finishOverlay.classList.remove("hidden");
          updateHud();
          if (state.levelIndex > 0) tapAds.preload("doubleCoins");
          save();
        }, 1050);
      }

      function screenPoint(event) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (event.clientX - rect.left) * state.width / rect.width,
          y: (event.clientY - rect.top) * state.height / rect.height
        };
      }

      function touchPoint(event) {
        const touch = event.changedTouches && event.changedTouches[0];
        if (!touch) return null;
        const rect = canvas.getBoundingClientRect();
        return {
          x: (touch.clientX - rect.left) * state.width / rect.width,
          y: (touch.clientY - rect.top) * state.height / rect.height
        };
      }

      function getTouchToolReach() {
        if (state.compactLandscape) return 52;
        const key = getActiveToolKey();
        if (["cotton-pad", "bandage"].includes(key)) return 68;
        if (["squeegee", "screen-scraper"].includes(key)) return 78;
        return clamp(state.height * .105, 72, 88);
      }

      function offsetToolPoint(raw, reach) {
        return {
          x: clamp(raw.x, 6, state.width - 6),
          y: clamp(raw.y - reach, 6, state.height - 6)
        };
      }

      function beginInput(raw, id, pointerType) {
        if (state.scene !== "play" || state.completed || state.pointer.down) return;
        unlockAudio();
        startToolLoop();
        gestureEl.classList.add("hidden");
        state.hasInteracted = true;
        state.pointerId = id;
        const handleMode = pointerType === "touch" || (!pointerType && window.matchMedia?.("(pointer: coarse)").matches);
        const reach = handleMode ? getTouchToolReach() : 0;
        const p = offsetToolPoint(raw, reach);
        Object.assign(state.pointer, {
          down: true,
          x: p.x, y: p.y, sx: p.x, sy: p.y, lastX: p.x, lastY: p.y,
          rawX: raw.x, rawY: raw.y, lastRawX: raw.x, lastRawY: raw.y,
          handleMode, reach, movedAt: performance.now()
        });

        if (state.level.type === "sort") {
          const d = state.data;
          for (let i = d.items.length - 1; i >= 0; i--) {
            const item = d.items[i];
            if (!item.placed && p.x >= item.x && p.x <= item.x + item.w && p.y >= item.y && p.y <= item.y + item.h) {
              d.held = item;
              item.grab = true;
              item.offsetX = p.x - item.x;
              item.offsetY = p.y - item.y;
              d.items.splice(i, 1);
              d.items.push(item);
              break;
            }
          }
        }
        if (state.level.type === "care") {
          beginCare(p);
        }
        if (state.level.type === "slice") playAction("contact");
        handlePointer(p, true);
      }

      function moveInput(raw, id) {
        if (!state.pointer.down || state.pointerId !== id || state.scene !== "play" || state.completed) return;
        const p = offsetToolPoint(raw, state.pointer.reach);
        state.pointer.lastX = state.pointer.x;
        state.pointer.lastY = state.pointer.y;
        state.pointer.lastRawX = state.pointer.rawX;
        state.pointer.lastRawY = state.pointer.rawY;
        state.pointer.x = p.x;
        state.pointer.y = p.y;
        state.pointer.rawX = raw.x;
        state.pointer.rawY = raw.y;
        state.pointer.movedAt = performance.now();
        handlePointer(p, false);
        if (state.level.type === "slice" && Math.hypot(p.x - state.pointer.lastX, p.y - state.pointer.lastY) > 1) {
          playAction("clean");
        }
      }

      function endInput(raw, id) {
        if (state.pointerId !== id) return;
        const p = offsetToolPoint(raw, state.pointer.reach);
        if (state.scene === "play" && !state.completed) {
          if (state.level.type === "slice") finishSlice(p);
          if (state.level.type === "sort") finishSort(p);
          if (state.level.type === "care") finishCare(p);
          playAction("release");
        }
        state.pointer.down = false;
        state.pointerId = null;
        state.pointer.handleMode = false;
        state.pointer.reach = 0;
        stopToolLoop();
      }

      function onPointerDown(event) {
        if (event.cancelable) event.preventDefault();
        if (state.scene !== "play" || state.completed) return;
        const p = screenPoint(event);
        try { canvas.setPointerCapture(event.pointerId); } catch (_) {}
        beginInput(p, event.pointerId, event.pointerType);
      }

      function onPointerMove(event) {
        if (event.cancelable) event.preventDefault();
        if (!state.pointer.down || event.pointerId !== state.pointerId || state.scene !== "play" || state.completed) return;
        const p = screenPoint(event);
        moveInput(p, event.pointerId);
      }

      function onPointerUp(event) {
        if (event.cancelable) event.preventDefault();
        if (event.pointerId !== state.pointerId) return;
        const p = screenPoint(event);
        endInput(p, event.pointerId);
      }

      function onMouseDown(event) {
        if (event.cancelable) event.preventDefault();
        if (event.button !== 0) return;
        beginInput(screenPoint(event), "mouse", "mouse");
      }

      function onMouseMove(event) {
        if (event.cancelable) event.preventDefault();
        moveInput(screenPoint(event), "mouse");
      }

      function onMouseUp(event) {
        if (event.cancelable) event.preventDefault();
        endInput(screenPoint(event), "mouse");
      }

      function onTouchStart(event) {
        if (event.cancelable) event.preventDefault();
        const p = touchPoint(event);
        if (p) beginInput(p, "touch", "touch");
      }

      function onTouchMove(event) {
        if (event.cancelable) event.preventDefault();
        const p = touchPoint(event);
        if (p) moveInput(p, "touch");
      }

      function onTouchEnd(event) {
        if (event.cancelable) event.preventDefault();
        const p = touchPoint(event) || { x: state.pointer.rawX, y: state.pointer.rawY };
        endInput(p, "touch");
      }

      function handlePointer(p, fresh) {
        if (!state.level) return;
        if (state.level.type === "clean") cleanAt(p);
        if (state.level.type === "pop") popAt(p, fresh ? 22 : 30);
        if (state.level.type === "sort") dragSort(p);
        if (state.level.type === "care") careAt(p, fresh);
      }

      function cleanAt(p) {
        const d = state.data;
        if (!insideRoundRect(p.x, p.y, d.rect)) return;
        let cleanedNow = 0;
        const radius = d.brush;
        for (const stain of d.stains) {
          if (!stain.cleaned && hitCircle(p, stain, radius + stain.size * .38)) {
            stain.cleaned = true;
            cleanedNow++;
            stain.fade = 1;
            addParticles(stain.x, stain.y, "#d3ded9", 2, 2.5);
          }
        }
        if (cleanedNow) {
          addTrail(p.x, p.y, "rgba(255,255,255,.72)", radius * .92, 1);
          d.cleaned += cleanedNow;
          state.progress = d.cleaned / d.stains.length;
          bumpCombo(p.x, p.y);
          playAction("clean");
          if (d.cleaned >= d.stains.length) completeLevel();
        } else {
          playAction("clean");
        }
      }

      function popAt(p, radius) {
        const d = state.data;
        let hit = 0;
        for (const bubble of d.bubbles) {
          if (!bubble.popped && hitCircle(p, bubble, bubble.r + radius)) {
            bubble.popped = true;
            bubble.life = 1;
            d.popped++;
            hit++;
            addParticles(bubble.x, bubble.y, bubble.special ? "#ffc857" : "#ffffff", bubble.special ? 12 : 7, bubble.special ? 7 : 4);
            playAction("pop");
          }
        }
        if (hit) {
          bumpCombo(p.x, p.y);
          state.progress = d.popped / d.total;
          if (d.popped >= d.total) completeLevel();
        }
      }

      function updateCareProgress(d, x, y) {
        state.progress = d.done / d.items.length;
        bumpCombo(x, y);
        playAction("care");
        if (d.done >= d.items.length) completeLevel();
      }

      function finishCareItem(d, item, x, y) {
        if (item.done) return;
        item.done = true;
        item.progress = 1;
        item.held = false;
        item.extracting = false;
        if (d.ordered && item.order === d.nextOrder) d.nextOrder++;
        d.done++;
        eraseRevealSpot(d, item.baseX || item.x, item.baseY || item.y, Math.max(36, item.r * 2.8), 1);
        if (d.careStyle === "pimple") {
          d.swabLoad++;
          d.extractionPulse = 1;
          addParticles(item.x, item.y - item.coreLength, "#f4dcc3", 7, 2.5);
        } else {
          addParticles(x || item.x, y || item.y, item.color || state.level.accent, 12, 5);
        }
        updateCareProgress(d, x || item.x, y || item.y);
      }

      function careItemHitDistance(point, item) {
        if (!item.spriteLength) return Math.hypot(point.x - item.x, point.y - item.y);
        const length = item.spriteLength * .92;
        const tipX = item.x + Math.sin(item.angle) * length;
        const tipY = item.y - Math.cos(item.angle) * length;
        return distancePointToSegment(point.x, point.y, item.x, item.y, tipX, tipY);
      }

      function beginCare(p) {
        const d = state.data;
        if (d.interaction === "pluck") {
          const nearest = d.items
            .filter(item => !item.done && careItemHitDistance(p, item) <= item.r + 20)
            .sort((a, b) => careItemHitDistance(p, a) - careItemHitDistance(p, b))[0];
          if (nearest) {
            d.held = nearest;
            nearest.held = true;
            nearest.offsetX = p.x - nearest.x;
            nearest.offsetY = p.y - nearest.y;
            playAction("contact");
          }
        }
        if (d.interaction === "hold") {
          d.holdTarget = d.items.find(item => !item.done && hitCircle(p, item, item.r + 22)) || null;
          if (d.holdTarget) {
            if (d.careStyle === "pimple") d.holdTarget.extracting = true;
            playAction("contact");
          }
        }
      }

      function careAt(p, fresh) {
        const d = state.data;
        if (d.interaction === "scrub") {
          const dx = p.x - state.pointer.lastX;
          const dy = p.y - state.pointer.lastY;
          const distance = Math.hypot(dx, dy);
          const scrapingHoof = d.careStyle === "hoof";
          const continuousScrub = continuousScrubStyles.has(d.careStyle);
          const directionOk = continuousScrub || fresh || !d.scrubAxis
            || (distance >= .7 && (d.scrubAxis === "horizontal"
              ? Math.abs(dx) >= Math.abs(dy) * .58
              : Math.abs(dy) >= Math.abs(dx) * .58));
          if (!directionOk) {
            if (!fresh && distance > 2) playAction("miss");
            return;
          }
          const touchesItem = (item, extra = 0) => fresh
            ? hitCircle(p, item, d.brush + item.r * .7 + extra)
            : distancePointToSegment(item.x, item.y, state.pointer.lastX, state.pointer.lastY, p.x, p.y)
              <= d.brush + item.r * .58 + extra;
          const inContinuousRegion = d.cleanRegions?.some(region => insideRoundRect(p.x, p.y, region))
            || (continuousScrub && d.cleanBounds && insideRoundRect(p.x, p.y, d.cleanBounds));
          const onCleanableSurface = inContinuousRegion || d.items.some(item => !item.done && touchesItem(item, 5));
          if (!onCleanableSurface) {
            d.revealLast = null;
            if (!fresh && distance > 2) playAction("miss");
            return;
          }
          if (!interactiveOnlyStyles.has(d.careStyle)) eraseRevealStroke(d, p, fresh);
          addTrail(p.x, p.y, scrapingHoof ? "rgba(255,255,255,.06)" : d.careStyle.includes("hoof") ? "rgba(255,255,255,.42)" : "rgba(255,255,255,.7)", d.brush * (scrapingHoof ? .72 : 1.05), scrapingHoof ? .2 : 1);
          let touched = false;
          let completedNow = 0;
          const movementBoost = fresh ? 1 : clamp(distance / 12, .85, 1.45);
          for (const item of d.items) {
            if (!item.done && touchesItem(item, continuousScrub ? 18 : 0)) {
              touched = true;
              item.progress += scrapingHoof
                ? (fresh ? .22 : .3 * movementBoost)
                : (fresh ? .34 : .48 * movementBoost);
              if (item.progress >= 1) {
                item.progress = 1;
                item.done = true;
                d.done++;
                addParticles(item.x, item.y, scrapingHoof ? "#6b4930" : item.color || state.level.accent, scrapingHoof ? 9 : 5, scrapingHoof ? 4.2 : 3);
                completedNow++;
              }
            }
          }
          if (!touched && continuousScrub && inContinuousRegion && distance > 1) {
            const nearest = d.items
              .filter(item => !item.done)
              .sort((a, b) => Math.hypot(p.x - a.x, p.y - a.y) - Math.hypot(p.x - b.x, p.y - b.y))[0];
            if (nearest && Math.hypot(p.x - nearest.x, p.y - nearest.y) <= d.brush * 2.25) {
              touched = true;
              nearest.progress = Math.min(1, nearest.progress + .16 * movementBoost);
              if (nearest.progress >= 1) {
                nearest.done = true;
                d.done++;
                completedNow++;
                addParticles(nearest.x, nearest.y, scrapingHoof ? "#6b4930" : "#d8f2f5", 8, 3.8);
              }
            }
          }
          if (touched) {
            state.progress = d.items.reduce((sum, item) => sum + clamp(item.progress, 0, 1), 0) / d.items.length;
            if (completedNow) {
              bumpCombo(p.x, p.y);
              playAction("care");
              if (d.done >= d.items.length) completeLevel();
            } else {
              playAction("clean");
            }
          }
        }
        if (d.interaction === "tap") {
          const nearest = d.items
            .filter(item => !item.done && hitCircle(p, item, item.r + 24))
            .sort((a, b) => Math.hypot(p.x - a.x, p.y - a.y) - Math.hypot(p.x - b.x, p.y - b.y))[0];
          if (nearest) {
            if (d.ordered && nearest.order !== d.nextOrder) playAction("miss");
            else finishCareItem(d, nearest, nearest.x, nearest.y);
          }
        }
        if (d.interaction === "pluck" && d.held) {
          addTrail(p.x, p.y, "rgba(255,255,255,.38)", 18, .65);
          d.held.x = p.x - d.held.offsetX;
          d.held.y = p.y - d.held.offsetY;
          playAction("clean");
        }
        if (d.interaction === "hold") {
          if (d.careStyle === "pimple") {
            if (d.holdTarget && !hitCircle(p, d.holdTarget, d.holdTarget.r + 36)) {
              d.holdTarget.extracting = false;
              d.holdTarget.progress = Math.max(0, d.holdTarget.progress - .08);
              d.holdTarget = null;
            }
          } else {
            d.holdTarget = d.items.find(item => !item.done && hitCircle(p, item, item.r + 24)) || null;
          }
        }
      }

      function updateCareHold(deltaMs) {
        if (state.level?.type !== "care" || state.completed || !state.pointer.down) return;
        const d = state.data;
        if (d.interaction !== "hold" || !d.holdTarget || d.holdTarget.done) return;
        const isPimple = d.careStyle === "pimple";
        d.holdTarget.progress = Math.min(1, d.holdTarget.progress + deltaMs / (isPimple ? 820 : 620));
        if (!isPimple || d.holdTarget.progress > .55) {
          addParticles(d.holdTarget.x, d.holdTarget.y - (isPimple ? d.holdTarget.coreLength * .7 : 0), isPimple ? "#f1ddc5" : state.level.accent, 1, isPimple ? 1.2 : 2.2);
        }
        playAction("clean");
        state.progress = (d.done + clamp(d.holdTarget.progress, 0, 1)) / d.items.length;
        if (d.holdTarget.progress >= 1) d.holdTarget.charged = true;
      }

      function finishCare(p) {
        const d = state.data;
        if (d.interaction === "scrub") d.revealLast = null;
        if (d.interaction === "pluck" && d.held) {
          const item = d.held;
          const pull = Math.hypot(item.x - item.baseX, item.y - item.baseY);
          if (pull > 44 || !insideRoundRect(item.x, item.y, d.area)) {
            finishCareItem(d, item, p.x, p.y);
          } else {
            item.x = item.baseX;
            item.y = item.baseY;
            item.held = false;
          }
          d.held = null;
        }
        if (d.interaction === "hold") {
          if (d.holdTarget) {
            const target = d.holdTarget;
            target.extracting = false;
            if (target.progress >= .96) {
              playAction("pop");
              finishCareItem(d, target, target.x, target.y);
            } else {
              target.progress = Math.max(0, target.progress * .9);
              target.charged = false;
            }
          }
          d.holdTarget = null;
        }
      }

      function finishSlice(p) {
        const d = state.data;
        const x1 = state.pointer.sx;
        const y1 = state.pointer.sy;
        const x2 = p.x;
        const y2 = p.y;
        const dist = Math.hypot(x2 - x1, y2 - y1);
        if (dist < 38 || !lineIntersectsRect(x1, y1, x2, y2, d.rect)) return;
        let cutNow = 0;
        for (const guide of d.guides) {
          if (guide.cut) continue;
          const mx = (guide.x1 + guide.x2) / 2;
          const my = (guide.y1 + guide.y2) / 2;
          const guideDistance = distanceSegmentToSegment(x1, y1, x2, y2, guide.x1, guide.y1, guide.x2, guide.y2);
          if (guideDistance < 48 || distancePointToSegment(mx, my, x1, y1, x2, y2) < 42 || lineIntersectsRect(x1, y1, x2, y2, {
            x: Math.min(guide.x1, guide.x2) - 16,
            y: Math.min(guide.y1, guide.y2) - 16,
            w: Math.abs(guide.x2 - guide.x1) + 32,
            h: Math.abs(guide.y2 - guide.y1) + 32,
            r: 8
          })) {
            guide.cut = true;
            cutNow++;
          }
        }
        if (!cutNow) {
          const nearest = d.guides
            .filter(guide => !guide.cut)
            .map(guide => ({
              guide,
              dist: distanceSegmentToSegment(x1, y1, x2, y2, guide.x1, guide.y1, guide.x2, guide.y2)
            }))
            .sort((a, b) => a.dist - b.dist)[0];
          if (nearest && lineIntersectsRect(x1, y1, x2, y2, d.rect)) {
            nearest.guide.cut = true;
            cutNow = 1;
          }
        }
        if (!cutNow) return;
        const mx = clamp((x1 + x2) / 2, d.rect.x, d.rect.x + d.rect.w);
        const my = clamp((y1 + y2) / 2, d.rect.y, d.rect.y + d.rect.h);
        d.cuts.push({ x1, y1, x2, y2, life: 1, width: lerp(4, 9, Math.random()) });
        eraseRevealLine(d, x1, y1, x2, y2, 18);
        addTrail(mx, my, "rgba(255,255,255,.9)", 20, 1);
        d.wobble = 1;
        for (let i = 0; i < 12; i++) {
          d.shavings.push({
            x: mx + (Math.random() - .5) * 80,
            y: my + (Math.random() - .5) * 40,
            vx: (Math.random() - .5) * 5,
            vy: -Math.random() * 5 - 1,
            rot: Math.random() * Math.PI,
            vr: (Math.random() - .5) * .16,
            size: lerp(7, 18, Math.random()),
            life: 1,
            color: Math.random() > .5 ? state.level.primary : state.level.accent
          });
        }
        state.progress = d.guides.filter(guide => guide.cut).length / d.guides.length;
        bumpCombo(mx, my);
        playAction("slice");
        if (d.guides.every(guide => guide.cut)) completeLevel();
      }

      function dragSort(p) {
        const d = state.data;
        if (!d.held) return;
        d.held.x = clamp(p.x - d.held.offsetX, 18, state.width - d.held.w - 18);
        d.held.y = clamp(p.y - d.held.offsetY, 105, state.height - d.held.h - 72);
      }

      function finishSort(p) {
        const d = state.data;
        if (!d.held) return;
        const item = d.held;
        const cx = item.x + item.w / 2;
        const cy = item.y + item.h / 2;
        const tx = item.homeX + item.w / 2;
        const ty = item.homeY + item.h / 2;
        if (Math.hypot(cx - tx, cy - ty) < item.w * .7) {
          item.x = item.homeX;
          item.y = item.homeY;
          item.angle = 0;
          item.placed = true;
          d.placed++;
          state.progress = d.placed / d.items.length;
          addParticles(tx, ty, item.color, 12, 5);
          bumpCombo(tx, ty);
          playAction("sort");
          if (state.progress >= 1) completeLevel();
        } else {
          item.angle = (Math.random() - .5) * .25;
        }
        item.grab = false;
        d.held = null;
      }

      function drawBackground() {
        const levelImage = getLevelImage();
        const useSceneImage = Boolean(levelImage && state.scene !== "start");
        const cacheScale = clamp(720 / Math.max(state.width, state.height), .35, .65);
        const cacheWidth = Math.max(180, Math.round(state.width * cacheScale));
        const cacheHeight = Math.max(180, Math.round(state.height * cacheScale));
        const cacheKey = `${state.scene}|${state.levelIndex}|${cacheWidth}x${cacheHeight}|${useSceneImage ? levelImage.currentSrc : "plain"}`;
        if (cacheKey !== backgroundCacheKey) {
          backgroundCache.width = cacheWidth;
          backgroundCache.height = cacheHeight;
          const bg = backgroundCacheContext;
          bg.setTransform(1, 0, 0, 1, 0, 0);
          bg.globalAlpha = 1;
          bg.filter = "none";
          bg.fillStyle = "#f9f6ec";
          bg.fillRect(0, 0, cacheWidth, cacheHeight);
          if (useSceneImage) {
            bg.save();
            bg.filter = "blur(9px) saturate(1.14)";
            bg.globalAlpha = .5;
            drawImageCoverOn(bg, levelImage, -14, -14, cacheWidth + 28, cacheHeight + 28);
            bg.restore();
            const veil = bg.createLinearGradient(0, 0, 0, cacheHeight);
            veil.addColorStop(0, "rgba(255,250,238,.74)");
            veil.addColorStop(.38, "rgba(243,255,251,.36)");
            veil.addColorStop(1, "rgba(255,245,235,.78)");
            bg.fillStyle = veil;
            bg.fillRect(0, 0, cacheWidth, cacheHeight);
          } else {
            const sky = bg.createLinearGradient(0, 0, 0, cacheHeight);
            sky.addColorStop(0, "#f9f6ec");
            sky.addColorStop(.42, "#edf8f4");
            sky.addColorStop(1, "#fff6f0");
            bg.fillStyle = sky;
            bg.fillRect(0, 0, cacheWidth, cacheHeight);
          }
          const tableY = cacheHeight * .74;
          bg.fillStyle = "rgba(255,255,255,.36)";
          bg.fillRect(0, tableY, cacheWidth, cacheHeight - tableY);
          bg.strokeStyle = "rgba(255,255,255,.52)";
          bg.lineWidth = Math.max(1, cacheScale * 2);
          bg.beginPath();
          bg.moveTo(0, tableY);
          bg.lineTo(cacheWidth, tableY);
          bg.stroke();
          backgroundCacheKey = cacheKey;
        }
        ctx.drawImage(backgroundCache, 0, 0, state.width, state.height);
        /*
          The blurred scene is intentionally cached at a reduced resolution. It is
          decorative, so redrawing it at native device resolution only wastes heat.
        */
      }

      function cleanObjectPath(rect, shape) {
        if (shape === "coin") {
          ctx.beginPath();
          ctx.ellipse(rect.x + rect.w / 2, rect.y + rect.h / 2, rect.w * .43, rect.h * .48, 0, 0, Math.PI * 2);
          return;
        }
        if (shape === "pan") {
          ctx.beginPath();
          ctx.ellipse(rect.x + rect.w * .48, rect.y + rect.h * .5, rect.w * .42, rect.h * .43, 0, 0, Math.PI * 2);
          ctx.rect(rect.x + rect.w * .77, rect.y + rect.h * .47, rect.w * .28, rect.h * .08);
          return;
        }
        if (shape === "keyboard") {
          roundRect(rect.x, rect.y + rect.h * .08, rect.w, rect.h * .84, 22);
          return;
        }
        if (shape === "glass") {
          roundRect(rect.x + rect.w * .04, rect.y, rect.w * .92, rect.h, 18);
          return;
        }
        roundRect(rect.x, rect.y, rect.w, rect.h, rect.r);
      }

      function drawClean() {
        const d = state.data;
        const rect = d.rect;
        ctx.save();
        ctx.shadowColor = "rgba(37,48,51,.18)";
        ctx.shadowBlur = 26;
        ctx.shadowOffsetY = 18;
        cleanObjectPath(rect, d.shape);
        ctx.fillStyle = state.level.primary;
        ctx.fill();
        ctx.shadowColor = "transparent";
        ctx.fillStyle = "rgba(255,255,255,.24)";
        roundRect(rect.x + 13, rect.y + 13, rect.w - 26, rect.h - 26, rect.r - 10);
        ctx.fill();
        ctx.strokeStyle = "rgba(37,48,51,.15)";
        ctx.lineWidth = 2;
        cleanObjectPath(rect, d.shape);
        ctx.stroke();
        ctx.clip();

        for (let i = 0; i < 8; i++) {
          ctx.globalAlpha = .1;
          ctx.fillStyle = i % 2 ? state.level.accent : "#ffffff";
          ctx.beginPath();
          ctx.ellipse(rect.x + rect.w * (.15 + i * .1), rect.y + rect.h * (.18 + (i % 3) * .22), rect.w * .22, 16, -.35, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        for (const stain of d.stains) {
          if (stain.cleaned && stain.fade <= 0) continue;
          if (stain.cleaned) stain.fade -= .06;
          ctx.globalAlpha = stain.cleaned ? Math.max(0, stain.fade) * .45 : 1;
          ctx.fillStyle = stain.hue;
          ctx.beginPath();
          if (stain.style === "dust") {
            ctx.arc(stain.x, stain.y, stain.size * .55, 0, Math.PI * 2);
          } else if (stain.style === "drops") {
            ctx.ellipse(stain.x, stain.y, stain.size * .58, stain.size, .1, 0, Math.PI * 2);
          } else {
            ctx.ellipse(stain.x, stain.y, stain.size, stain.size * lerp(.34, .72, Math.sin(stain.x) * .5 + .5), stain.x * .05, 0, Math.PI * 2);
          }
          ctx.fill();
        }

        if (state.progress > .35) {
          ctx.globalAlpha = Math.min(.85, state.progress);
          ctx.strokeStyle = "rgba(255,255,255,.92)";
          ctx.lineWidth = 8;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(rect.x + rect.w * .2, rect.y + rect.h * .75);
          ctx.quadraticCurveTo(rect.x + rect.w * .5, rect.y + rect.h * .52, rect.x + rect.w * .78, rect.y + rect.h * .32);
          ctx.stroke();
        }
        ctx.restore();

        if (state.pointer.down) {
          drawSponge(state.pointer.x, state.pointer.y);
        }
      }

      function drawSponge(x, y) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(-.22);
        ctx.shadowColor = "rgba(37,48,51,.2)";
        ctx.shadowBlur = 12;
        ctx.shadowOffsetY = 7;
        roundRect(-30, -20, 60, 40, 12);
        ctx.fillStyle = "#ffd166";
        ctx.fill();
        ctx.shadowColor = "transparent";
        ctx.fillStyle = "rgba(255,255,255,.35)";
        for (let i = 0; i < 10; i++) {
          ctx.beginPath();
          ctx.arc(-20 + (i % 5) * 10, -8 + Math.floor(i / 5) * 16, 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function bubblePath(bubble, r) {
        const style = bubble.style || "round";
        if (style === "capsule") {
          roundRect(bubble.x - r * 1.18, bubble.y - r * .64, r * 2.36, r * 1.28, r * .64);
          return;
        }
        if (style === "coin") {
          ctx.beginPath();
          ctx.ellipse(bubble.x, bubble.y, r * 1.06, r * .82, -.18, 0, Math.PI * 2);
          return;
        }
        if (style === "drop") {
          ctx.beginPath();
          ctx.moveTo(bubble.x, bubble.y - r * 1.18);
          ctx.bezierCurveTo(bubble.x + r * .9, bubble.y - r * .2, bubble.x + r * .72, bubble.y + r, bubble.x, bubble.y + r * 1.08);
          ctx.bezierCurveTo(bubble.x - r * .72, bubble.y + r, bubble.x - r * .9, bubble.y - r * .2, bubble.x, bubble.y - r * 1.18);
          ctx.closePath();
          return;
        }
        if (style === "star") {
          ctx.beginPath();
          for (let i = 0; i < 10; i++) {
            const a = -Math.PI / 2 + i * Math.PI / 5;
            const rr = i % 2 === 0 ? r * 1.05 : r * .48;
            const x = bubble.x + Math.cos(a) * rr;
            const y = bubble.y + Math.sin(a) * rr;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.closePath();
          return;
        }
        ctx.beginPath();
        ctx.arc(bubble.x, bubble.y, r, 0, Math.PI * 2);
      }

      function drawPop() {
        const d = state.data;
        for (const bubble of d.bubbles) {
          const pulse = Math.sin(state.time * .004 + bubble.pulse) * 1.8;
          if (bubble.popped) {
            bubble.life -= .05;
            if (bubble.life > 0) {
              ctx.save();
              ctx.globalAlpha = bubble.life;
              ctx.strokeStyle = bubble.special ? "#ffc857" : "rgba(255,255,255,.9)";
              ctx.lineWidth = 3;
              ctx.beginPath();
              ctx.arc(bubble.x, bubble.y, bubble.r * (1.25 + (1 - bubble.life) * .6), 0, Math.PI * 2);
              ctx.stroke();
              ctx.restore();
            }
            continue;
          }
          const gradient = ctx.createRadialGradient(bubble.x - bubble.r * .35, bubble.y - bubble.r * .42, bubble.r * .08, bubble.x, bubble.y, bubble.r + pulse);
          gradient.addColorStop(0, "rgba(255,255,255,.95)");
          gradient.addColorStop(.22, bubble.special ? "#fff2a2" : "rgba(255,255,255,.72)");
          gradient.addColorStop(1, bubble.special ? state.level.accent : state.level.primary);
          ctx.save();
          ctx.shadowColor = "rgba(37,48,51,.12)";
          ctx.shadowBlur = 12;
          ctx.shadowOffsetY = 7;
          ctx.fillStyle = gradient;
          bubblePath(bubble, bubble.r + pulse);
          ctx.fill();
          ctx.shadowColor = "transparent";
          ctx.strokeStyle = "rgba(37,48,51,.12)";
          ctx.lineWidth = 1.4;
          ctx.stroke();
          ctx.fillStyle = "rgba(255,255,255,.85)";
          ctx.beginPath();
          ctx.ellipse(bubble.x - bubble.r * .28, bubble.y - bubble.r * .34, bubble.r * .16, bubble.r * .08, -.55, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      function drawSlice() {
        const d = state.data;
        const rect = d.rect;
        const levelImage = getLevelImage("clean");
        ctx.save();
        ctx.translate(rect.x + rect.w / 2, rect.y + rect.h / 2);
        const scaleY = 1 + Math.sin(state.time * .022) * .012 * d.wobble;
        ctx.scale(1, scaleY);
        ctx.translate(-rect.w / 2, -rect.h / 2);
        ctx.shadowColor = "rgba(37,48,51,.2)";
        ctx.shadowBlur = 26;
        ctx.shadowOffsetY = 18;
        roundRect(0, 0, rect.w, rect.h, rect.r);
        ctx.fillStyle = state.level.primary;
        ctx.fill();
        ctx.shadowColor = "transparent";
        ctx.clip();
        if (levelImage) {
          drawImageCover(levelImage, 0, 0, rect.w, rect.h);
          ctx.fillStyle = "rgba(255,255,255,.16)";
          ctx.fillRect(0, 0, rect.w, rect.h * .28);
        } else {
          for (let i = 0; i < 7; i++) {
            ctx.fillStyle = i % 2 ? "rgba(255,255,255,.22)" : state.level.accent;
            ctx.globalAlpha = i % 2 ? 1 : .18;
            ctx.fillRect(-20 + i * 64, 0, 28, rect.h);
          }
          ctx.globalAlpha = 1;
          ctx.fillStyle = "rgba(255,255,255,.22)";
          ctx.fillRect(0, 0, rect.w, rect.h * .28);
        }
        ctx.restore();

        drawDirtySceneLayer(d);

        ctx.save();
        roundRect(rect.x, rect.y, rect.w, rect.h, rect.r);
        ctx.clip();
        for (const guide of d.guides) {
          if (guide.cut) continue;
          ctx.save();
          ctx.strokeStyle = "rgba(37,48,51,.28)";
          ctx.lineWidth = 3;
          ctx.setLineDash([8, 9]);
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(guide.x1, guide.y1);
          ctx.lineTo(guide.x2, guide.y2);
          ctx.stroke();
          ctx.restore();
        }
        for (const cut of d.cuts) {
          ctx.strokeStyle = "rgba(37,48,51,.2)";
          ctx.lineWidth = cut.width + 5;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(cut.x1, cut.y1);
          ctx.lineTo(cut.x2, cut.y2);
          ctx.stroke();
          ctx.strokeStyle = "rgba(255,255,255,.82)";
          ctx.lineWidth = cut.width;
          ctx.beginPath();
          ctx.moveTo(cut.x1, cut.y1);
          ctx.lineTo(cut.x2, cut.y2);
          ctx.stroke();
        }
        ctx.restore();

        d.wobble *= .9;
        for (const shaving of d.shavings) {
          ctx.save();
          ctx.translate(shaving.x, shaving.y);
          ctx.rotate(shaving.rot);
          ctx.globalAlpha = Math.max(0, shaving.life);
          roundRect(-shaving.size / 2, -shaving.size / 5, shaving.size, shaving.size / 2.5, 4);
          ctx.fillStyle = shaving.color;
          ctx.fill();
          ctx.restore();
          shaving.x += shaving.vx;
          shaving.y += shaving.vy;
          shaving.vy += .18;
          shaving.rot += shaving.vr;
          shaving.life -= .009;
        }
        d.shavings = d.shavings.filter(s => s.life > 0 && s.y < state.height + 80);

        if (state.pointer.down) {
          ctx.save();
          ctx.strokeStyle = "rgba(37,48,51,.42)";
          ctx.lineWidth = 4;
          ctx.setLineDash([8, 8]);
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(state.pointer.sx, state.pointer.sy);
          ctx.lineTo(state.pointer.x, state.pointer.y);
          ctx.stroke();
          ctx.restore();
        }
      }

      function drawSort() {
        const d = state.data;
        for (const slot of d.slots) {
          ctx.save();
          ctx.strokeStyle = "rgba(37,48,51,.18)";
          ctx.lineWidth = 2;
          ctx.setLineDash([8, 7]);
          roundRect(slot.x, slot.y, slot.w, slot.h, 14);
          ctx.stroke();
          ctx.restore();
        }

        for (const item of d.items) {
          drawItem(item);
        }
      }

      function drawItem(item) {
        ctx.save();
        ctx.translate(item.x + item.w / 2, item.y + item.h / 2);
        ctx.rotate(item.angle);
        const lift = item.grab ? 12 : 7;
        ctx.shadowColor = "rgba(37,48,51,.18)";
        ctx.shadowBlur = item.grab ? 24 : 14;
        ctx.shadowOffsetY = lift;
        if (item.shape === 0) {
          roundRect(-item.w / 2, -item.h / 2, item.w, item.h, 14);
          ctx.fillStyle = item.color;
          ctx.fill();
        } else if (item.shape === 1) {
          ctx.fillStyle = item.color;
          ctx.beginPath();
          ctx.arc(0, 0, item.w * .42, 0, Math.PI * 2);
          ctx.fill();
        } else if (item.shape === 2) {
          ctx.fillStyle = item.color;
          ctx.beginPath();
          ctx.moveTo(0, -item.h * .45);
          ctx.lineTo(item.w * .45, item.h * .38);
          ctx.lineTo(-item.w * .45, item.h * .38);
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.fillStyle = item.color;
          ctx.beginPath();
          ctx.ellipse(0, 0, item.w * .44, item.h * .32, -.32, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.shadowColor = "transparent";
        ctx.strokeStyle = "rgba(37,48,51,.13)";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = "rgba(255,255,255,.42)";
        ctx.beginPath();
        ctx.ellipse(-item.w * .15, -item.h * .18, item.w * .18, item.h * .08, -.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawCareSurface(d) {
        const a = d.area;
        const levelImage = getLevelImage("clean");
        if (levelImage) {
          ctx.save();
          ctx.shadowColor = "rgba(25,30,31,.24)";
          ctx.shadowBlur = 28;
          ctx.shadowOffsetY = 17;
          roundRect(a.x, a.y, a.w, a.h, a.r);
          ctx.fillStyle = "#fffaf2";
          ctx.fill();
          ctx.shadowColor = "transparent";
          ctx.clip();
          drawImageCover(levelImage, a.x, a.y, a.w, a.h);
          ctx.restore();
          ctx.save();
          ctx.strokeStyle = "rgba(255,255,255,.48)";
          ctx.lineWidth = 1.5;
          roundRect(a.x, a.y, a.w, a.h, a.r);
          ctx.stroke();
          ctx.restore();
          return;
        }
        if ((d.careStyle === "pimple" || d.careStyle === "pimpleMask") && d.skinTexture) {
          ctx.save();
          ctx.shadowColor = "rgba(88,44,38,.22)";
          ctx.shadowBlur = 28;
          ctx.shadowOffsetY = 17;
          roundRect(a.x, a.y, a.w, a.h, a.r);
          ctx.fillStyle = "#eaa38d";
          ctx.fill();
          ctx.shadowColor = "transparent";
          ctx.clip();
          ctx.drawImage(d.skinTexture, a.x, a.y, a.w, a.h);

          const moist = ctx.createRadialGradient(a.x + a.w * .28, a.y + a.h * .18, 0, a.x + a.w * .35, a.y + a.h * .28, a.w * .58);
          moist.addColorStop(0, "rgba(255,255,255,.23)");
          moist.addColorStop(.38, "rgba(255,255,255,.045)");
          moist.addColorStop(1, "rgba(255,255,255,0)");
          ctx.fillStyle = moist;
          ctx.fillRect(a.x, a.y, a.w, a.h);

          ctx.globalAlpha = .16;
          ctx.strokeStyle = "rgba(255,247,239,.8)";
          ctx.lineWidth = 1;
          for (let i = 0; i < 28; i++) {
            const x = a.x + ((i * 83) % Math.max(1, a.w));
            const y = a.y + ((i * 137) % Math.max(1, a.h));
            ctx.beginPath();
            ctx.arc(x, y, 4 + (i % 4), .15, 1.35);
            ctx.stroke();
          }
          ctx.restore();

          ctx.save();
          ctx.strokeStyle = "rgba(103,49,43,.2)";
          ctx.lineWidth = 2;
          roundRect(a.x, a.y, a.w, a.h, a.r);
          ctx.stroke();
          ctx.restore();
          return;
        }
        if (levelImage) {
          ctx.save();
          ctx.shadowColor = "rgba(37,48,51,.18)";
          ctx.shadowBlur = 28;
          ctx.shadowOffsetY = 17;
          roundRect(a.x, a.y, a.w, a.h, a.r);
          ctx.fillStyle = "#fffaf2";
          ctx.fill();
          ctx.shadowColor = "transparent";
          ctx.clip();
          drawImageCover(levelImage, a.x, a.y, a.w, a.h);
          if (state.progress > .2) {
            ctx.globalAlpha = clamp(state.progress * .18, 0, .18);
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(a.x, a.y, a.w, a.h);
          }
          ctx.restore();

          ctx.save();
          ctx.strokeStyle = "rgba(37,48,51,.16)";
          ctx.lineWidth = 2;
          roundRect(a.x, a.y, a.w, a.h, a.r);
          ctx.stroke();
          ctx.restore();
          return;
        }

        ctx.save();
        ctx.shadowColor = "rgba(37,48,51,.16)";
        ctx.shadowBlur = 25;
        ctx.shadowOffsetY = 16;
        if (d.careStyle.includes("hoof")) {
          ctx.beginPath();
          ctx.moveTo(a.x + a.w * .24, a.y + a.h * .13);
          ctx.quadraticCurveTo(a.x + a.w * .5, a.y - a.h * .05, a.x + a.w * .76, a.y + a.h * .13);
          ctx.quadraticCurveTo(a.x + a.w * .88, a.y + a.h * .52, a.x + a.w * .66, a.y + a.h * .88);
          ctx.lineTo(a.x + a.w * .34, a.y + a.h * .88);
          ctx.quadraticCurveTo(a.x + a.w * .12, a.y + a.h * .52, a.x + a.w * .24, a.y + a.h * .13);
          ctx.closePath();
        } else if (d.careStyle.includes("nose")) {
          roundRect(a.x + a.w * .13, a.y + a.h * .06, a.w * .74, a.h * .82, 80);
        } else if (d.careStyle.includes("ear")) {
          ctx.beginPath();
          ctx.ellipse(a.x + a.w * .5, a.y + a.h * .48, a.w * .32, a.h * .42, .15, 0, Math.PI * 2);
        } else if (d.careStyle.includes("teeth")) {
          roundRect(a.x + a.w * .09, a.y + a.h * .17, a.w * .82, a.h * .56, 36);
        } else if (d.careStyle.includes("screen")) {
          roundRect(a.x + a.w * .16, a.y + a.h * .03, a.w * .68, a.h * .9, 34);
        } else {
          roundRect(a.x, a.y, a.w, a.h, a.r);
        }
        const g = ctx.createLinearGradient(a.x, a.y, a.x + a.w, a.y + a.h);
        g.addColorStop(0, state.level.primary);
        g.addColorStop(1, "#fffaf2");
        ctx.fillStyle = g;
        ctx.fill();
        ctx.shadowColor = "transparent";
        ctx.strokeStyle = "rgba(37,48,51,.14)";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();

        if (d.careStyle.includes("nose")) {
          ctx.save();
          ctx.fillStyle = "rgba(37,48,51,.23)";
          ctx.beginPath();
          ctx.ellipse(a.x + a.w * .4, a.y + a.h * .48, a.w * .11, a.h * .16, -.15, 0, Math.PI * 2);
          ctx.ellipse(a.x + a.w * .6, a.y + a.h * .48, a.w * .11, a.h * .16, .15, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        if (d.careStyle.includes("teeth")) {
          ctx.save();
          ctx.strokeStyle = "rgba(37,48,51,.12)";
          ctx.lineWidth = 2;
          for (let i = 1; i < 6; i++) {
            ctx.beginPath();
            ctx.moveTo(a.x + a.w * (.12 + i * .13), a.y + a.h * .2);
            ctx.lineTo(a.x + a.w * (.12 + i * .13), a.y + a.h * .7);
            ctx.stroke();
          }
          ctx.restore();
        }
        if (d.careStyle.includes("glass")) {
          ctx.save();
          ctx.globalAlpha = .32 + state.progress * .45;
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.ellipse(a.x + a.w * .5, a.y + a.h * .45, a.w * .28, a.h * .16, -.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = .42;
          ctx.fillStyle = state.level.accent;
          ctx.fillRect(a.x + a.w * .18, a.y + a.h * .72, a.w * .64, 8);
          ctx.restore();
        }
      }

      function drawPimpleItem(d, item) {
        const pressure = clamp(item.progress, 0, 1);
        const pulse = .5 + Math.sin(state.time * .012 + item.x) * .5;
        ctx.save();

        if (item.done) {
          item.heal = Math.min(1, (item.heal || 0) + .018);
          const fade = 1 - item.heal;
          const healRadius = lerp(item.r * 1.08, item.r * .44, item.heal);
          const healGlow = ctx.createRadialGradient(item.x, item.y, 0, item.x, item.y, item.r * 1.8);
          healGlow.addColorStop(0, `rgba(236,112,96,${.24 * fade})`);
          healGlow.addColorStop(.48, `rgba(255,186,168,${.13 * fade})`);
          healGlow.addColorStop(1, "rgba(255,186,168,0)");
          ctx.fillStyle = healGlow;
          ctx.beginPath();
          ctx.arc(item.x, item.y, item.r * 1.8, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = `rgba(137,72,62,${.22 * (1 - item.heal * .72)})`;
          ctx.beginPath();
          ctx.ellipse(item.x, item.y, healRadius * .45, healRadius * .25, item.angle, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          return;
        }

        const compression = item.extracting ? Math.sin(Math.min(1, pressure) * Math.PI * .72) : 0;
        const skin = ctx.createRadialGradient(item.x - item.r * .28, item.y - item.r * .34, 1, item.x, item.y, item.r * 1.65);
        skin.addColorStop(0, `rgba(255,225,209,${.32 + compression * .15})`);
        skin.addColorStop(.5, `rgba(224,128,110,${.16 + compression * .12})`);
        skin.addColorStop(1, "rgba(170,78,67,0)");
        ctx.fillStyle = skin;
        ctx.beginPath();
        ctx.ellipse(item.x, item.y + compression * 1.8, item.r * (1.5 - compression * .18), item.r * (.98 - compression * .2), item.angle, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = `rgba(255,235,223,${.52 + compression * .22})`;
        ctx.lineWidth = 1.25;
        ctx.beginPath();
        ctx.ellipse(item.x, item.y, item.r * (.55 + compression * .18), item.r * (.34 - compression * .08), item.angle, 0, Math.PI * 2);
        ctx.stroke();

        const emerge = clamp((pressure - .22) / .72, 0, 1);
        if (emerge > 0) {
          const tipX = item.x + emerge * 7;
          const tipY = item.y - item.coreLength * emerge;
          const core = ctx.createLinearGradient(item.x, item.y, tipX, tipY);
          core.addColorStop(0, "rgba(112,72,43,.9)");
          core.addColorStop(.48, "rgba(232,193,139,.98)");
          core.addColorStop(1, "rgba(247,222,180,.98)");
          ctx.strokeStyle = core;
          ctx.lineWidth = lerp(item.pore * 1.7, item.pore * .9, emerge);
          ctx.lineCap = "round";
          ctx.shadowColor = "rgba(95,62,42,.2)";
          ctx.shadowBlur = 4;
          ctx.beginPath();
          ctx.moveTo(item.x, item.y - 1);
          ctx.quadraticCurveTo(item.x - 2, item.y - item.coreLength * .42, tipX, tipY);
          ctx.stroke();
          ctx.shadowColor = "transparent";
          ctx.fillStyle = "rgba(76,54,38,.88)";
          ctx.beginPath();
          ctx.arc(tipX, tipY, item.pore * lerp(1.25, .72, emerge), 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = "rgba(48,38,33,.88)";
          ctx.shadowColor = "rgba(44,30,24,.32)";
          ctx.shadowBlur = 3 + pulse * 2;
          ctx.beginPath();
          ctx.ellipse(item.x, item.y, item.pore * 1.1, item.pore * .88, item.angle, 0, Math.PI * 2);
          ctx.fill();
        }

        if (item.extracting) {
          ctx.globalAlpha = .32 + pressure * .42;
          ctx.strokeStyle = "rgba(255,255,255,.9)";
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(item.x, item.y, item.r * 1.52, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * pressure);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawRepairPatchItem(item) {
        ctx.save();
        if (item.done) {
          const settle = Math.min(1, (item.heal || 0) + .025);
          item.heal = settle;
          ctx.globalAlpha = .72 + settle * .2;
          ctx.translate(item.x, item.y);
          ctx.rotate(item.angle * .22);
          const patch = ctx.createRadialGradient(-item.r * .25, -item.r * .28, 1, 0, 0, item.r * 1.15);
          patch.addColorStop(0, "rgba(244,255,251,.96)");
          patch.addColorStop(.64, "rgba(186,238,222,.86)");
          patch.addColorStop(1, "rgba(116,194,174,.62)");
          ctx.fillStyle = patch;
          ctx.shadowColor = "rgba(53,123,107,.18)";
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.arc(0, 0, item.r * .92, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowColor = "transparent";
          ctx.strokeStyle = "rgba(255,255,255,.78)";
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.arc(0, 0, item.r * .7, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
          return;
        }

        const pressure = clamp(item.progress, 0, 1);
        const skin = ctx.createRadialGradient(item.x, item.y, 1, item.x, item.y, item.r * 1.35);
        skin.addColorStop(0, "rgba(255,244,223,.98)");
        skin.addColorStop(.3, "rgba(245,177,151,.92)");
        skin.addColorStop(1, "rgba(220,110,96,0)");
        ctx.fillStyle = skin;
        ctx.beginPath();
        ctx.arc(item.x, item.y, item.r * (1.1 - pressure * .12), 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "rgba(255,250,228,.96)";
        ctx.beginPath();
        ctx.arc(item.x, item.y - 1, item.r * .24, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = `rgba(128,209,190,${.18 + pressure * .72})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(item.x, item.y, item.r * 1.18, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * pressure);
        ctx.stroke();
        ctx.restore();
      }

      function irregularBlobPath(rx, ry, seed) {
        const points = [];
        const count = 10;
        for (let i = 0; i < count; i++) {
          const angle = Math.PI * 2 * i / count;
          const variation = .78 + ((seed * 17 + i * 29) % 13) / 36;
          points.push({ x: Math.cos(angle) * rx * variation, y: Math.sin(angle) * ry * variation });
        }
        const first = points[0];
        const last = points[points.length - 1];
        ctx.beginPath();
        ctx.moveTo((last.x + first.x) / 2, (last.y + first.y) / 2);
        for (let i = 0; i < points.length; i++) {
          const point = points[i];
          const next = points[(i + 1) % points.length];
          ctx.quadraticCurveTo(point.x, point.y, (point.x + next.x) / 2, (point.y + next.y) / 2);
        }
        ctx.closePath();
      }

      function drawInteractiveCareLayer(d) {
        const bounds = d.cleanBounds || d.area;
        ctx.save();
        roundRect(bounds.x, bounds.y, bounds.w, bounds.h, bounds.r || 0);
        ctx.clip();
        for (const item of d.items) {
          if (item.done || d.interaction !== "scrub") continue;
          const isTeeth = d.careStyle.includes("teeth");
          const image = getInteractiveAsset(item.assetName || (
            d.careStyle === "ear" ? "ear-wax"
              : isTeeth ? "teeth-stains"
                : "glass-residue"
          ));
          if (!image) continue;
          const isSticker = item.kind === "sticker";
          const width = item.r * (isSticker ? 2.45 : isTeeth ? 1.35 : 2.15);
          const height = item.r * (isSticker ? 2.35 : isTeeth ? 1.7 : 1.55);
          ctx.save();
          ctx.globalAlpha = 1 - clamp(item.progress, 0, 1) * .94;
          ctx.translate(item.x, item.y - item.progress * 5);
          ctx.rotate(item.angle + item.progress * .08);
          ctx.shadowColor = isSticker ? "rgba(31, 42, 43, .24)" : "rgba(62, 42, 26, .18)";
          ctx.shadowBlur = isSticker ? 8 : 3;
          ctx.shadowOffsetY = isSticker ? 5 : 2;
          if (isSticker) {
            const ratio = image.naturalWidth / Math.max(1, image.naturalHeight);
            const drawWidth = ratio >= 1 ? width : height * ratio;
            const drawHeight = ratio >= 1 ? width / ratio : height;
            ctx.drawImage(image, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
          } else if (isTeeth) {
            const stain = ctx.createRadialGradient(-width * .18, -height * .22, 1, 0, 0, width * .62);
            stain.addColorStop(0, "rgba(184,128,43,.72)");
            stain.addColorStop(.64, "rgba(145,91,30,.46)");
            stain.addColorStop(1, "rgba(111,68,29,0)");
            ctx.fillStyle = stain;
