<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#f7f4ea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/app-icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/app-icon-512.png">
  <title>爽感制造所</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #253033;
      --muted: #6b7777;
      --paper: #fbf8ef;
      --mint: #a7ddd0;
      --coral: #ff8b7b;
      --gold: #ffc857;
      --plum: #7a5c9d;
      --line: rgba(37, 48, 51, .13);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      touch-action: none;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      position: fixed;
      inset: 0;
    }

    #app {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        linear-gradient(180deg, #f9f6ec 0%, #edf8f4 42%, #fdfaf3 100%);
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      -webkit-user-drag: none;
    }

    img {
      -webkit-user-drag: none;
    }

    .hud {
      position: absolute;
      left: max(14px, env(safe-area-inset-left));
      right: max(14px, env(safe-area-inset-right));
      top: max(12px, env(safe-area-inset-top));
      display: grid;
      gap: 10px;
      pointer-events: none;
      z-index: 4;
    }

    .hud-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      min-width: 0;
    }

    .brand strong {
      display: block;
      font-size: clamp(21px, 5vw, 32px);
      line-height: 1;
      letter-spacing: 0;
    }

    .brand span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pills {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }

    .pill,
    .icon-button {
      height: 36px;
      border: 1px solid rgba(37, 48, 51, .12);
      background: rgba(255, 255, 255, .76);
      box-shadow: 0 8px 22px rgba(41, 45, 48, .08);
      backdrop-filter: blur(16px);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0 11px;
      border-radius: 18px;
      font-weight: 800;
      font-size: 13px;
      white-space: nowrap;
    }

    .coin-dot {
      width: 12px;
      height: 12px;
      flex: 0 0 12px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 28%, #fff7a5 0 24%, var(--gold) 25% 100%);
      box-shadow: inset 0 -1px 0 rgba(96, 68, 0, .2);
    }

    .icon-button {
      width: 36px;
      border-radius: 50%;
      padding: 0;
      color: var(--ink);
      pointer-events: auto;
      display: inline-grid;
      place-items: center;
      cursor: pointer;
    }

    .icon-button svg {
      width: 18px;
      height: 18px;
      stroke-width: 2.4;
    }

    .restart-button img {
      width: 20px;
      height: 20px;
      object-fit: contain;
      pointer-events: none;
      filter: drop-shadow(0 2px 3px rgba(37, 48, 51, .12));
      transition: transform .16s ease;
    }

    .restart-button:active img {
      transform: rotate(-34deg) scale(.9);
    }

    .level-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 32px;
      pointer-events: none;
    }

    .level-actions .icon-button {
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
      border-color: rgba(129, 165, 158, .2);
      background: rgba(247, 255, 252, .67);
      box-shadow: 0 4px 10px rgba(37, 48, 51, .07), inset 0 1px 0 rgba(255, 255, 255, .72);
    }

    .level-action-group {
      display: flex;
      align-items: center;
      gap: 5px;
      opacity: .74;
      pointer-events: none;
      transition: opacity .16s ease;
    }

    .level-action-group:hover,
    .level-action-group:focus-within {
      opacity: .96;
    }

    .level-action-group > button {
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
    }

    .level-actions.is-resetting .level-action-group {
      opacity: .74 !important;
      transition: none !important;
    }

    .control-assets-ready .level-actions.is-resetting .previous-button {
      background-image: url("assets/ui/ui-previous.webp") !important;
      filter: saturate(.74) drop-shadow(0 3px 6px rgba(37, 48, 51, .07)) !important;
      transform: none !important;
      transition: none !important;
    }

    .control-assets-ready .level-actions.is-resetting .skip-button {
      background-image: url("assets/ui/ui-skip.webp") !important;
      filter: saturate(.74) drop-shadow(0 3px 6px rgba(37, 48, 51, .07)) !important;
      transform: none !important;
      transition: none !important;
    }

    .level-actions.is-resetting .icon-button img {
      transform: none !important;
      transition: none !important;
    }

    .home-button img {
      width: 20px;
      height: 20px;
      object-fit: contain;
      pointer-events: none;
      filter: drop-shadow(0 2px 3px rgba(37, 48, 51, .12));
      transition: transform .16s ease;
    }

    .home-button:active img {
      transform: scale(.88);
    }

    .previous-button {
      position: relative;
      width: 110px;
      height: 34px;
      padding: 0 12px 0 35px;
      border: 0;
      color: #253033;
      background: transparent;
      font: inherit;
      font-size: 12px;
      font-weight: 850;
      letter-spacing: 0;
      cursor: pointer;
      pointer-events: auto;
      text-shadow: 0 1px 0 rgba(255, 255, 255, .9);
      filter: saturate(.74) drop-shadow(0 3px 6px rgba(37, 48, 51, .07));
      transition: opacity .18s ease, filter .18s ease, transform .12s ease;
    }

    .control-assets-ready .previous-button {
      background: transparent url("assets/ui/ui-previous.webp") center / 100% 100% no-repeat;
    }

    .previous-button::before {
      content: "";
      position: absolute;
      left: 14px;
      top: 50%;
      width: 8px;
      height: 8px;
      border-left: 2px solid #4b7069;
      border-bottom: 2px solid #4b7069;
      transform: translateY(-50%) rotate(45deg);
    }

    .control-assets-ready .previous-button:active:not(:disabled) {
      background-image: url("assets/ui/ui-previous-pressed.webp");
      filter: drop-shadow(0 2px 4px rgba(37, 48, 51, .08));
      transform: translateY(1px);
    }

    .skip-button {
      position: relative;
      width: 108px;
      height: 34px;
      padding: 0 33px 0 11px;
      border: 0;
      color: #253033;
      background: transparent;
      font: inherit;
      font-size: 12px;
      font-weight: 850;
      letter-spacing: 0;
      cursor: pointer;
      text-shadow: 0 1px 0 rgba(255, 255, 255, .9);
      filter: saturate(.74) drop-shadow(0 3px 6px rgba(37, 48, 51, .07));
      transition: opacity .18s ease, filter .18s ease, transform .12s ease;
    }

    .control-assets-ready .skip-button {
      background: transparent url("assets/ui/ui-skip.webp") center / 100% 100% no-repeat;
    }

    .skip-button svg {
      position: absolute;
      right: 11px;
      top: 50%;
      width: 14px;
      height: 14px;
      color: #4b7069;
      stroke-width: 2.6;
      transform: translateY(-50%);
    }

    .control-assets-ready .skip-button:active:not(:disabled) {
      background-image: url("assets/ui/ui-skip-pressed.webp");
      filter: drop-shadow(0 2px 4px rgba(37, 48, 51, .08));
      transform: translateY(1px);
    }

    .previous-button:disabled,
    .restart-button:disabled,
    .home-button:disabled,
    .skip-button:disabled {
      opacity: .42;
      cursor: default;
      filter: grayscale(.35);
    }

    .previous-button:focus-visible,
    .skip-button:focus-visible,
    .icon-button:focus-visible {
      outline: 2px solid #4b9f91;
      outline-offset: 2px;
    }

    .meter-wrap {
      height: 15px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .62);
      box-shadow: inset 0 0 0 1px rgba(37, 48, 51, .09), 0 8px 26px rgba(38, 68, 67, .07);
      overflow: hidden;
    }

    .meter {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--coral), var(--gold) 45%, var(--mint));
      transition: width .18s ease-out;
    }

    .level-hint {
      min-height: 18px;
      color: rgba(37, 48, 51, .72);
      font-size: 12px;
      line-height: 18px;
      font-weight: 800;
      text-align: center;
      text-shadow: 0 1px 0 rgba(255, 255, 255, .78);
      transition: opacity .24s ease;
    }

    .level-hint.subdued {
      opacity: .42;
    }

    .level-hint.ad-state {
      color: #b96f4a;
      opacity: 1;
    }

    .bottom-bar {
      position: absolute;
      left: max(14px, env(safe-area-inset-left));
      right: max(14px, env(safe-area-inset-right));
      bottom: max(14px, env(safe-area-inset-bottom));
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
    }

    .tool-chip {
      min-width: 0;
      max-width: 68%;
      height: 54px;
      border: 1px solid rgba(37, 48, 51, .11);
      border-radius: 27px;
      background: rgba(255, 255, 255, .75);
      box-shadow: 0 14px 34px rgba(41, 45, 48, .12);
      backdrop-filter: blur(16px);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0 17px 0 3px;
    }

    .tool-preview {
      width: 68px;
      height: 72px;
      flex: 0 0 66px;
      object-fit: contain;
      pointer-events: none;
      filter: drop-shadow(0 7px 7px rgba(27, 37, 39, .22));
      transform: translateY(-4px) rotate(-5deg);
      transform-origin: 50% 70%;
      transition: opacity .16s ease, transform .18s ease;
    }

    .tool-preview.is-tall {
      transform: translate(5px, -5px) rotate(-38deg) scale(1.06);
      transform-origin: 50% 50%;
    }

    .tool-preview.is-wide {
      transform: translateY(-4px) rotate(-7deg) scale(1.06);
    }

    .tool-preview.is-round {
      transform: translateY(-5px) rotate(-4deg) scale(.94);
    }

    .tool-chip span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 900;
      font-size: 14px;
    }

    .combo {
      height: 48px;
      min-width: 78px;
      border-radius: 24px;
      background: #253033;
      color: #fff;
      display: inline-grid;
      place-items: center;
      padding: 0 14px;
      font-weight: 950;
      box-shadow: 0 14px 30px rgba(37, 48, 51, .2);
      transform: translateY(18px);
      opacity: 0;
      transition: transform .16s ease, opacity .16s ease;
    }

    .combo.on {
      transform: translateY(0);
      opacity: 1;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
      background: rgba(247, 244, 234, .72);
      backdrop-filter: blur(18px);
      transition: opacity .2s ease, visibility .2s ease;
    }

    .overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .celebration-layer {
      position: absolute;
      inset: 0;
      z-index: 9;
      display: grid;
      place-items: center;
      overflow: hidden;
      pointer-events: none;
      background: rgba(246, 250, 246, .2);
      transition: opacity .16s ease, visibility .16s ease;
    }

    .celebration-layer.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .celebration-center {
      position: relative;
      display: grid;
      place-items: center;
      width: min(72vw, 360px);
      aspect-ratio: 1;
    }

    .celebration-ring {
      position: absolute;
      inset: 12%;
      border: 8px solid rgba(255, 200, 87, .78);
      border-radius: 50%;
      opacity: 0;
    }

    .celebration-star {
      width: min(30vw, 138px);
      aspect-ratio: 1;
      clip-path: polygon(50% 3%, 61% 36%, 96% 36%, 68% 57%, 79% 93%, 50% 71%, 21% 93%, 32% 57%, 4% 36%, 39% 36%);
      background: #ffc857;
      filter: drop-shadow(0 18px 18px rgba(86, 68, 20, .22));
      opacity: 0;
    }

    .celebration-label {
      position: absolute;
      top: 76%;
      color: #253033;
      font-size: clamp(26px, 7vw, 40px);
      line-height: 1;
      font-weight: 950;
      text-shadow: 0 3px 0 rgba(255, 255, 255, .9), 0 10px 22px rgba(37, 48, 51, .2);
      opacity: 0;
    }

    .confetti-piece {
      position: absolute;
      left: 50%;
      top: 48%;
      width: 10px;
      height: 20px;
      border-radius: 3px;
      background: var(--gold);
      opacity: 0;
    }

    .celebration-layer.play .celebration-ring { animation: celebration-ring .82s ease-out both; }
    .celebration-layer.play .celebration-star { animation: celebration-star .72s cubic-bezier(.18, .86, .22, 1.24) .08s both; }
    .celebration-layer.play .celebration-label { animation: celebration-label .46s ease-out .32s both; }
    .celebration-layer.play .confetti-piece { animation: celebration-confetti .92s cubic-bezier(.2, .74, .32, 1) both; }

    @keyframes celebration-ring {
      0% { opacity: .9; transform: scale(.28); }
      76% { opacity: .56; }
      100% { opacity: 0; transform: scale(1.34); }
    }

    @keyframes celebration-star {
      0% { opacity: 0; transform: scale(.18) rotate(-24deg); }
      58% { opacity: 1; transform: scale(1.12) rotate(5deg); }
      100% { opacity: 1; transform: scale(1) rotate(0); }
    }

    @keyframes celebration-label {
      from { opacity: 0; transform: translateY(16px) scale(.92); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes celebration-confetti {
      0% { opacity: 0; transform: translate3d(-50%, -50%, 0) scale(.2) rotate(0); }
      18% { opacity: 1; }
      100% { opacity: 0; transform: translate3d(var(--x), var(--y), 0) scale(.9) rotate(var(--r)); }
    }

    .start-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      overflow: hidden;
      color: #fff;
      background: #243632;
      isolation: isolate;
      transition: opacity .36s ease, visibility .36s ease;
    }

    .start-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .start-media,
    .start-media img,
    .start-effects {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .start-media img {
      object-fit: cover;
      object-position: center;
      animation: start-camera 11s ease-in-out infinite alternate;
    }

    .start-overlay::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(14, 23, 22, .36) 0%, rgba(14, 23, 22, .04) 42%, rgba(14, 23, 22, .12) 62%, rgba(14, 23, 22, .7) 100%);
    }

    .start-effects {
      z-index: 2;
      object-fit: cover;
      opacity: .62;
      pointer-events: none;
      filter: drop-shadow(0 8px 10px rgba(22, 35, 36, .15));
      animation: start-effects-float 6.5s ease-in-out infinite alternate;
    }

    .start-shell {
      position: relative;
      z-index: 3;
      width: min(100%, 1180px);
      height: 100%;
      margin: 0 auto;
      padding:
        max(22px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .start-brand {
      width: min(100%, 520px);
      text-shadow: 0 3px 20px rgba(10, 17, 16, .7);
    }

    .start-emblem {
      display: block;
      width: clamp(92px, 24vw, 148px);
      aspect-ratio: 1;
      object-fit: contain;
      margin: 0 0 4px -6px;
      filter: drop-shadow(0 16px 22px rgba(11, 24, 23, .28));
      animation: start-emblem-bob 3.4s ease-in-out infinite;
    }

    .start-kicker {
      display: block;
      margin-bottom: 7px;
      color: #d9fff7;
      font-size: 12px;
      line-height: 1.2;
      font-weight: 950;
      text-transform: uppercase;
    }

    .start-brand h1 {
      max-width: 8em;
      color: #fff;
      font-size: clamp(42px, 11vw, 68px);
      line-height: .96;
      text-wrap: balance;
    }

    .start-brand p {
      max-width: min(92vw, 21em);
      margin: 12px 0 0;
      color: rgba(255, 255, 255, .94);
      font-size: clamp(14px, 3.7vw, 18px);
      line-height: 1.55;
      font-weight: 750;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-all;
    }

    .start-actions {
      width: min(100%, 440px);
      justify-self: center;
      text-align: center;
      text-shadow: 0 2px 12px rgba(10, 17, 16, .7);
    }

    .start-primary {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 60px;
      padding: 0 24px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .35);
      border-radius: 30px;
      color: #fff;
      background: rgba(24, 37, 38, .94);
      box-shadow: 0 18px 42px rgba(9, 18, 18, .32), inset 0 1px 0 rgba(255, 255, 255, .16);
      backdrop-filter: blur(14px);
      font: inherit;
      font-size: 18px;
      font-weight: 950;
      cursor: pointer;
      transform: translateZ(0);
    }

    .start-primary::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 22%, rgba(255, 255, 255, .18) 48%, transparent 74%);
      transform: translateX(-110%);
      animation: start-button-sheen 3.4s ease-in-out infinite;
    }

    .start-primary svg {
      position: relative;
      width: 21px;
      height: 21px;
      fill: #ffc857;
      stroke: #ffc857;
      flex: 0 0 21px;
    }

    .start-primary span {
      position: relative;
    }

    .start-first {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 44px;
      margin-top: 8px;
      padding: 0 20px;
      border: 1px solid rgba(255, 255, 255, .28);
      border-radius: 22px;
      color: rgba(255, 255, 255, .94);
      background: rgba(24, 37, 38, .58);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .1);
      backdrop-filter: blur(12px);
      font: inherit;
      font-size: 14px;
      font-weight: 850;
      cursor: pointer;
    }

    .start-first[hidden] {
      display: none;
    }

    .start-first svg {
      width: 16px;
      height: 16px;
      color: #d9fff7;
      stroke-width: 2.3;
    }

    .start-first:active {
      background: rgba(24, 37, 38, .76);
      transform: translateY(1px);
    }

    .start-first:focus-visible {
      outline: 2px solid #d9fff7;
      outline-offset: 2px;
    }

    .start-features {
      margin-top: 12px;
      color: rgba(255, 255, 255, .88);
      font-size: 12px;
      line-height: 1.4;
      font-weight: 850;
    }

    .start-reset {
      appearance: none;
      margin-top: 8px;
      padding: 6px 10px;
      border: 0;
      color: rgba(255, 255, 255, .76);
      background: transparent;
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
    }

    @keyframes start-camera {
      from { transform: scale(1.015) translate3d(0, 0, 0); }
      to { transform: scale(1.065) translate3d(0, -1.2%, 0); }
    }

    @keyframes start-effects-float {
      from { transform: translate3d(-.8%, -.35%, 0) scale(1.015); }
      to { transform: translate3d(.8%, .5%, 0) scale(1.04); }
    }

    @keyframes start-emblem-bob {
      0%, 100% { transform: translate3d(0, 0, 0) rotate(-1.2deg); }
      50% { transform: translate3d(0, -6px, 0) rotate(1.2deg); }
    }

    @keyframes start-button-sheen {
      0%, 58% { transform: translateX(-110%); }
      82%, 100% { transform: translateX(110%); }
    }

    .panel {
      width: min(430px, 100%);
      border: 1px solid rgba(37, 48, 51, .12);
      border-radius: 8px;
      background: rgba(255, 255, 255, .83);
      box-shadow: 0 30px 90px rgba(44, 58, 60, .18);
      padding: clamp(20px, 5vw, 30px);
      text-align: center;
    }

    h1,
    h2 {
      margin: 0;
      letter-spacing: 0;
    }

    h1 {
      font-size: clamp(34px, 10vw, 50px);
      line-height: .95;
    }

    h2 {
      font-size: clamp(28px, 8vw, 40px);
      line-height: 1;
    }

    .panel p {
      margin: 14px auto 0;
      max-width: 31em;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.65;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 20px 0;
    }

    .stat {
      border: 1px solid rgba(37, 48, 51, .1);
      border-radius: 8px;
      padding: 12px 8px;
      background: #fffaf2;
    }

    .stat b {
      display: block;
      font-size: 22px;
      line-height: 1.05;
    }

    .stat span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .primary,
    .secondary,
    .reward-ad {
      appearance: none;
      width: 100%;
      min-height: 52px;
      border-radius: 26px;
      border: 0;
      font-weight: 950;
      font-size: 16px;
      cursor: pointer;
    }

    .reward-ad[hidden] {
      display: none;
    }

    .primary {
      background: var(--ink);
      color: white;
      box-shadow: 0 14px 28px rgba(37, 48, 51, .18);
    }

    .reward-ad {
      margin-top: 10px;
      background: #fff2c9;
      color: #604500;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .75), 0 8px 18px rgba(158, 111, 26, .12);
    }

    .secondary {
      margin-top: 10px;
      background: #e5f4ef;
      color: var(--ink);
    }

    .stars {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 18px 0 10px;
    }

    .star {
      width: 42px;
      height: 42px;
      clip-path: polygon(50% 4%, 61% 36%, 95% 36%, 68% 56%, 79% 91%, 50% 70%, 21% 91%, 32% 56%, 5% 36%, 39% 36%);
      background: #d8dedc;
    }

    .star.on {
      background: var(--gold);
      box-shadow: 0 8px 18px rgba(255, 200, 87, .4);
    }

    .gesture {
      position: absolute;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 3;
      border: 2px solid rgba(37, 48, 51, .2);
      background: rgba(255, 255, 255, .5);
      box-shadow: 0 10px 22px rgba(37, 48, 51, .12);
      animation: glide 2.1s ease-in-out infinite;
      opacity: .72;
    }

    .gesture.hidden {
      display: none;
    }

    .gesture.vertical {
      animation-name: glide-vertical;
    }

    .gesture.hold {
      animation-name: press-hold;
      animation-duration: 1.45s;
    }

    @keyframes glide {
      0%, 100% { transform: translate3d(-42px, 0, 0) scale(.92); }
      50% { transform: translate3d(42px, -22px, 0) scale(1); }
    }

    @keyframes glide-vertical {
      0%, 100% { transform: translate3d(0, -34px, 0) scale(.92); }
      50% { transform: translate3d(0, 34px, 0) scale(1); }
    }

    @keyframes press-hold {
      0%, 100% { transform: scale(.9); box-shadow: 0 8px 18px rgba(37, 48, 51, .1); }
      48%, 68% { transform: scale(.72); box-shadow: 0 3px 9px rgba(37, 48, 51, .16); }
    }

    @media (min-width: 780px) {
      #app {
        max-width: 560px;
        left: 50%;
        transform: translateX(-50%);
        box-shadow: 0 0 0 1px rgba(37, 48, 51, .08), 0 20px 100px rgba(37, 48, 51, .18);
      }

      body {
        background:
          linear-gradient(90deg, #edf8f4, #fbf8ef 38%, #fff2ed 100%);
      }
    }

    @media (orientation: landscape) and (min-width: 780px) {
      .start-shell {
        padding-left: max(5vw, env(safe-area-inset-left));
        padding-right: max(5vw, env(safe-area-inset-right));
      }

        align-self: start;
      }

      .start-emblem {
        width: clamp(90px, 10vw, 132px);

    @media (max-width: 480px) {
      .start-brand {
        width: calc(100vw - max(40px, env(safe-area-inset-left) + env(safe-area-inset-right)));
        max-width: 100%;
      }

      .start-brand h1 {
        max-width: 100%;
        font-size: 40px;
      }

      .start-brand p {
        width: min(100%, 340px);
        max-width: calc(100vw - 56px);
        font-size: 14px;
        line-height: 1.45;
        overflow-wrap: anywhere;
        word-break: break-all;
      }
    }

    @media (max-width: 380px) {
      .level-action-group {
        gap: 2px;
      }

      .level-actions .icon-button {
        width: 30px;
        height: 30px;
        flex-basis: 30px;
      }

      .home-button img,
      .restart-button img {
        width: 18px;
        height: 18px;
      }

      .previous-button {
        width: 98px;
        height: 31px;
        padding: 0 7px 0 31px;

      }

      .previous-button::before {
        left: 13px;
        width: 7px;
        height: 7px;
      }

      .skip-button {
        width: 92px;
        height: 31px;
        padding: 0 28px 0 7px;
        font-size: 10px;
      }

      .skip-button svg {
        right: 9px;

        height: 12px;
      }
    }

    @media (max-height: 700px) {
      .start-emblem { width: 78px; }
      .start-brand h1 { font-size: 38px; }
      .start-brand p { margin-top: 8px; font-size: 13px; line-height: 1.4; }
      .start-primary { min-height: 52px; }
      .start-features { margin-top: 7px; }
      .start-reset { margin-top: 2px; }
    }

    @media (orientation: landscape) and (max-height: 540px) {
      #app {
        max-width: none;
        left: 0;
        transform: none;
        box-shadow: none;
      }

      .hud {
        left: max(8px, env(safe-area-inset-left));

      .pill, .icon-button { height: 28px; }

      .level-actions { min-height: 27px; }
      .level-actions .icon-button { width: 27px; height: 27px; flex-basis: 27px; }
      .home-button img, .restart-button img { width: 17px; height: 17px; }
      .previous-button, .skip-button { width: 88px; height: 27px; font-size: 10px; }
      .previous-button { padding: 0 6px 0 28px; }

      .tool-chip { height: 42px; border-radius: 21px; padding-right: 12px; }
      .tool-preview { width: 52px; height: 54px; flex-basis: 50px; }
      .tool-chip span { font-size: 12px; }

    }

    @media (prefers-reduced-motion: reduce) {
      .start-media img,
      .start-effects,
      .start-emblem,
      .start-primary::before {
        animation: none;
      }

      .celebration-layer.play .celebration-ring,

      .celebration-layer.play .celebration-label,
      .celebration-layer.play .confetti-piece {
        animation-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>

    <section class="hud" aria-live="polite">

  <section class="start-overlay" id="startOverlay" aria-labelledby="startTitle">
    <picture class="start-media" aria-hidden="true">
      <source media="(orientation: landscape)" srcset="assets/start/start-cover-landscape.webp">
      <img src="assets/start/start-cover-portrait.webp" alt="" fetchpriority="high" decoding="async">
    </picture>
    <img class="start-effects" src="assets/start/start-effects.webp" alt="" aria-hidden="true" decoding="async" fetchpriority="low">
    <div class="start-shell">
      <div class="start-brand">
        <img class="start-emblem" src="assets/start/start-emblem.webp" alt="" aria-hidden="true" decoding="async" fetchpriority="low">
        <span class="start-kicker">沉浸式解压工坊</span>
        <h1 id="startTitle">爽感制造所</h1>
        <p>刮掉、拔出、擦净、抛光。每一次操作，都要爽到彻底。</p>
      </div>
      <div aria-hidden="true"></div>
      <div class="start-actions">
        <button class="start-primary" id="startBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
          <span id="startBtnLabel">开始解压</span>
        </button>
        <button class="start-first" id="startFirstBtn" type="button" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 5v14"></path><path d="m18 6-7 6 7 6"></path>
          </svg>
          <span>重新开启旅程</span>
        </button>
        <div class="start-features">多种精选玩法&nbsp;&nbsp;·&nbsp;&nbsp;每次清净才过关</div>
        <button class="start-reset" id="resetBtn">重置游戏进度</button>
      </div>
    </div>
  </section>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d", { alpha: false });
      const app = document.getElementById("app");
      const meter = document.getElementById("meter");
      const coinsEl = document.getElementById("coins");
      const levelTitleEl = document.getElementById("levelTitle");
      const levelHintEl = document.getElementById("levelHint");
      const comboEl = document.getElementById("combo");
      const toolNameEl = document.getElementById("toolName");
      const toolImageEl = document.getElementById("toolImage");
      const gestureEl = document.getElementById("gesture");
      const nextBtn = document.getElementById("nextBtn");
      const startOverlay = document.getElementById("startOverlay");
      const startBtnLabel = document.getElementById("startBtnLabel");
      const startFirstBtn = document.getElementById("startFirstBtn");
      const finishOverlay = document.getElementById("finishOverlay");
      const celebrationLayer = document.getElementById("celebrationLayer");
      const celebrationLabel = document.getElementById("celebrationLabel");
      const finishTitleEl = document.getElementById("finishTitle");
      const finishMessageEl = document.getElementById("finishMessage");
      const rewardCoinsEl = document.getElementById("rewardCoins");
      const rewardComboEl = document.getElementById("rewardCombo");
      const rewardStreakEl = document.getElementById("rewardStreak");
      const rewardAdBtn = document.getElementById("rewardAdBtn");
      const starsEl = document.getElementById("stars");
      const soundIcon = document.getElementById("soundIcon");
      const homeBtn = document.getElementById("homeBtn");
      const previousBtn = document.getElementById("previousBtn");
      const skipBtn = document.getElementById("skipBtn");
      const skipBtnLabel = document.getElementById("skipBtnLabel");
      const restartBtn = document.getElementById("restartBtn");
      const levelActionsEl = document.querySelector(".level-actions");
      let controlAssetsReady = false;

      function ensureControlAssets() {
        if (controlAssetsReady) return;
        controlAssetsReady = true;
        document.documentElement.classList.add("control-assets-ready");
        for (const image of document.querySelectorAll(".level-actions img[data-src]")) {
          image.src = image.dataset.src;
        }
      }

      const storageKey = "satisfaction-factory-v1";
      const campaignVersion = 15;
      const previousCampaignScenes = [1, 4, 5, 6, 7, 8, 9, 11, 13, 15, 16, 17, 19, 20];
      const TAPTAP_AD_CONFIG = {
        // 在 TapTap 广告后台取得 adUnitId 后，只修改这里的两项。
        rewarded: {
          skipLevel: "1065355",
          doubleCoins: "1065357"
        }
      };
      const tapAds = (() => {
        const pending = Object.create(null);
        const preloadState = Object.create(null);
        const slotState = Object.create(null);
        let activeSlot = "";
        let activeAd = null;
        const getRuntime = () => {
          const runtime = globalThis.tap;
          return runtime && (typeof runtime === "object" || typeof runtime === "function")
            ? runtime
            : null;
        };
        // Presence of the Tap runtime and readiness of its ad API are different
        // states. Keeping them separate prevents a real package from silently
        // taking the browser-only bypass path while the bridge is still starting.
        const isTapRuntime = () => Boolean(getRuntime());
        const hasRewardedApi = () => typeof getRuntime()?.createRewardedVideoAd === "function";
        const getAdUnitId = slot => {
          const value = TAPTAP_AD_CONFIG.rewarded?.[slot];
          if (typeof value !== "string") return "";
          const normalized = value.trim();
          return normalized && !/^(xxxx|your-ad-unit-id|请替换)/i.test(normalized) ? normalized : "";
        };
        const getStatus = slot => {
          if (!isTapRuntime()) return "browser";
          if (!hasRewardedApi()) return "sdk_not_ready";
          if (!getAdUnitId(slot)) return "missing_ad_unit_id";
          return "ready";
        };
        const canUse = slot => getStatus(slot) === "ready";
        const getSlotState = slot => {
          if (!slotState[slot]) {
            slotState[slot] = {
              loaded: false,
              error: { code: 0, message: "" }
            };
          }
          return slotState[slot];
        };
        const get = slot => {
          if (!canUse(slot)) return null;
          if (activeAd && activeSlot === slot) return activeAd;
          // TapTap documents rewarded video as a lifecycle singleton. Destroy
          // the previous slot before switching to the other reward placement.
          if (activeAd && activeSlot !== slot) {
            try { activeAd.destroy?.(); } catch (_) {}
            activeAd = null;
            activeSlot = "";
          }
          try {
            const ad = getRuntime().createRewardedVideoAd({
              adUnitId: getAdUnitId(slot)
            });
            const currentState = getSlotState(slot);
            currentState.loaded = false;
            currentState.error = { code: 0, message: "" };
            ad.onLoad?.(() => {
              currentState.loaded = true;
              currentState.error = { code: 0, message: "" };
              preloadState[slot] = "ready";
              console.info("[TapAd] loaded", slot);
            });
            ad.onError?.(error => {
              currentState.loaded = false;
              currentState.error = normalizeError(error);
              preloadState[slot] = "failed";
              console.warn("[TapAd] error", slot, error);
            });
            activeAd = ad;
            activeSlot = slot;
            return ad;
          } catch (error) {
            console.warn("[TapAd] create failed", slot, error);
            return null;
          }
        };
        const load = ad => {
          if (!ad || typeof ad.load !== "function") return Promise.reject(new Error("ad_load_unavailable"));
          try {
            return Promise.resolve(ad.load());
          } catch (error) {
            return Promise.reject(error);
          }
        };
        const safeShow = ad => {
          if (!ad || typeof ad.show !== "function") return Promise.reject(new Error("ad_show_unavailable"));
          try {
            return Promise.resolve(ad.show());
          } catch (error) {
            return Promise.reject(error);
          }
        };
        const normalizeError = error => {
          const source = error && typeof error === "object" ? error : {};
          const rawCode = source.errCode ?? source.errorCode ?? source.code ?? source.errno ?? source.statusCode;
          const code = Number.isFinite(Number(rawCode))
            ? Number(rawCode)
            : (() => {
                const match = String(source.errMsg || source.message || error || "").match(/\b(\d{3,5})\b/);
                return match ? Number(match[1]) : 0;
              })();
          const message = String(source.errMsg || source.message || error || "");
          return { code, message };
        };
        const isRetryableCode = code => {
          // These codes describe configuration, review, platform, or test
          // environment problems. Retrying the same request cannot fix them.
          return ![1001, 1002, 1005, 1006, 1007, 1008, 3100].includes(code);
        };
        const isRetryableError = error => isRetryableCode(normalizeError(error).code);
        const preload = slot => {
          if (!canUse(slot) || preloadState[slot] === "warming" || preloadState[slot] === "ready") return false;
          preloadState[slot] = "warming";
          const ad = get(slot);
          if (!ad) {
            preloadState[slot] = "failed";
            return false;
          }
          // createRewardedVideoAd automatically starts loading. Calling load()
          // here as well can race the SDK's first request and cause a false
          // load failure before the player taps the button.
          return true;
        };
        const show = slot => new Promise(resolve => {
          if (pending[slot]) {
            resolve({ ok: false, reason: "already_pending" });
            return;
          }
          const status = getStatus(slot);
          if (status !== "ready") {
            resolve({ ok: false, reason: status });
            return;
          }
          const ad = get(slot);
          if (!ad) {
            resolve({ ok: false, reason: "create_failed" });
            return;
          }
          const currentState = getSlotState(slot);
          if (preloadState[slot] === "failed" && currentState.error.code && !isRetryableCode(currentState.error.code)) {
            resolve({
              ok: false,
              reason: "ad_error",
              errorCode: currentState.error.code,
              errorMessage: currentState.error.message
            });
            return;
          }
          pending[slot] = true;
          let settled = false;
          let timeoutId = 0;
          let closeHandler;
          let errorHandler;
          let lastError = { code: 0, message: "" };
          const finish = result => {
            if (settled) return;
            settled = true;
            clearTimeout(timeoutId);
            pending[slot] = false;
            preloadState[slot] = result?.ok ? "spent" : "failed";
            currentState.loaded = false;
            ad.offClose?.(closeHandler);
            ad.offError?.(errorHandler);
            resolve(result);
          };
          closeHandler = result => {
            currentState.loaded = false;
            finish({
              ok: Boolean(result && result.isEnded),
              reason: result && result.isEnded ? "completed" : "closed_early"
            });
          };
          errorHandler = error => {
            console.warn("[TapAd] show error", slot, error);
            // onError can belong to the SDK's automatic preload. Remember it,
            // but let the explicit load -> show retry decide whether to fail.
            lastError = normalizeError(error);
            currentState.error = lastError;
            currentState.loaded = false;
          };
          ad.onClose?.(closeHandler);
          ad.onError?.(errorHandler);
          // Keep the first show() call in the player's click call stack. If the
          // SDK rejects because the creative is cold, reload once and retry.
          let retried = false;
          safeShow(ad)
            .then(() => {
              console.info("[TapAd] shown", slot);
            })
            .catch(error => {
              console.warn("[TapAd] first show rejected", slot, error);
              const showError = normalizeError(error);
              lastError = showError.code ? showError : lastError;
              currentState.error = lastError;
              if (lastError.code && !isRetryableCode(lastError.code)) {
                finish({
                  ok: false,
                  reason: "ad_error",
                  errorCode: lastError.code,
                  errorMessage: lastError.message
                });
                return null;
              }
              retried = true;
              return load(ad).then(() => {
                currentState.loaded = true;
                return safeShow(ad);
              });
            })
            .then(() => {
              if (retried) console.info("[TapAd] retry shown", slot);
            })

        mask.moveTo(x1 - data.area.x, y1 - data.area.y);
        mask.lineTo(x2 - data.area.x, y2 - data.area.y);
        mask.stroke();
        mask.restore();
        markRevealChanged(data);
      }

      function drawDirtySceneLayer(data) {
        const image = getLevelImage("dirty");
        return drawMaskedAssetLayer(data, image);
      }

      function drawMaskedAssetLayer(data, image) {
        if (!image || !data?.revealMask || !data.revealComposite) return false;
        const layer = data.revealComposite;
        if (data.revealCompositeVersion !== data.revealVersion || data.revealCompositeImage !== image) {
          const layerCtx = layer.getContext("2d");
          layerCtx.clearRect(0, 0, layer.width, layer.height);
          layerCtx.globalCompositeOperation = "source-over";
          drawImageCoverOn(layerCtx, image, 0, 0, layer.width, layer.height);
          layerCtx.globalCompositeOperation = "destination-in";
          layerCtx.drawImage(data.revealMask, 0, 0, layer.width, layer.height);
          layerCtx.globalCompositeOperation = "source-over";
          data.revealCompositeVersion = data.revealVersion;
          data.revealCompositeImage = image;
        }

        const fade = state.completed
          ? clamp(1 - (state.time - state.completedAt) / 460, 0, 1)
          : 1;
        ctx.save();
        ctx.globalAlpha = fade;
        roundRect(data.area.x, data.area.y, data.area.w, data.area.h, data.area.r);
        ctx.clip();
        ctx.drawImage(layer, data.area.x, data.area.y, data.area.w, data.area.h);
        ctx.restore();
        return true;
      }

      function clearRevealLayer(data) {
        if (!data?.revealMask) return;
        data.revealMask.getContext("2d").clearRect(0, 0, data.revealMask.width, data.revealMask.height);
        data.revealLast = null;
        markRevealChanged(data);
      }

      function drawProtectedSceneLayer(data) {
        const image = getLevelImage("dirty");
        const edges = data?.protectedEdges;
        if (!image || !edges) return;
        const a = data.area;
        const left = a.w * edges.left;
        const right = a.w * edges.right;
        const top = a.h * edges.top;
        const bottom = a.h * edges.bottom;
        ctx.save();
        roundRect(a.x, a.y, a.w, a.h, a.r);
        ctx.clip();
        ctx.beginPath();
        if (left > 0) ctx.rect(a.x, a.y, left, a.h);
        if (right > 0) ctx.rect(a.x + a.w - right, a.y, right, a.h);
        if (top > 0) ctx.rect(a.x, a.y, a.w, top);
        if (bottom > 0) ctx.rect(a.x, a.y + a.h - bottom, a.w, bottom);
        ctx.clip();
        drawImageCover(image, a.x, a.y, a.w, a.h);
        ctx.restore();
      }

      function insideRoundRect(px, py, rect) {
        return px >= rect.x && px <= rect.x + rect.w && py >= rect.y && py <= rect.y + rect.h;
      }

      function hitCircle(a, b, r) {
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        return dx * dx + dy * dy <= r * r;
      }

      function lineIntersectsRect(x1, y1, x2, y2, rect) {
        if (insideRoundRect(x1, y1, rect) || insideRoundRect(x2, y2, rect)) return true;
        const minX = Math.min(x1, x2), maxX = Math.max(x1, x2);
        const minY = Math.min(y1, y2), maxY = Math.max(y1, y2);
        return maxX >= rect.x && minX <= rect.x + rect.w && maxY >= rect.y && minY <= rect.y + rect.h;
      }

      function distancePointToSegment(px, py, x1, y1, x2, y2) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        const len = dx * dx + dy * dy || 1;
        const t = clamp(((px - x1) * dx + (py - y1) * dy) / len, 0, 1);
        const x = x1 + dx * t;
        const y = y1 + dy * t;
        return Math.hypot(px - x, py - y);
      }

      function segmentsIntersect(a, b, c, d) {
        const cross = (p1, p2, p3) => (p2.x - p1.x) * (p3.y - p1.y) - (p2.y - p1.y) * (p3.x - p1.x);
        const onBox = (p, q, r) => q.x >= Math.min(p.x, r.x) - .1 && q.x <= Math.max(p.x, r.x) + .1
          && q.y >= Math.min(p.y, r.y) - .1 && q.y <= Math.max(p.y, r.y) + .1;
        const d1 = cross(a, b, c);
        const d2 = cross(a, b, d);
        const d3 = cross(c, d, a);
        const d4 = cross(c, d, b);
        if ((d1 > 0 && d2 < 0 || d1 < 0 && d2 > 0) && (d3 > 0 && d4 < 0 || d3 < 0 && d4 > 0)) return true;
        return Math.abs(d1) < .1 && onBox(a, c, b)
          || Math.abs(d2) < .1 && onBox(a, d, b)
          || Math.abs(d3) < .1 && onBox(c, a, d)
          || Math.abs(d4) < .1 && onBox(c, b, d);
      }

      function distanceSegmentToSegment(x1, y1, x2, y2, x3, y3, x4, y4) {
        const a = { x: x1, y: y1 };
        const b = { x: x2, y: y2 };
        const c = { x: x3, y: y3 };
        const d = { x: x4, y: y4 };
        if (segmentsIntersect(a, b, c, d)) return 0;
        return Math.min(
          distancePointToSegment(x1, y1, x3, y3, x4, y4),
          distancePointToSegment(x2, y2, x3, y3, x4, y4),
          distancePointToSegment(x3, y3, x1, y1, x2, y2),
          distancePointToSegment(x4, y4, x1, y1, x2, y2)
        );
      }

      function createSkinTexture(width, height, random) {
        const surface = document.createElement("canvas");
        const scale = Math.min(1.7, Math.max(1, state.dpr));
        surface.width = Math.max(2, Math.round(width * scale));
        surface.height = Math.max(2, Math.round(height * scale));
        const skin = surface.getContext("2d", { alpha: false });
        const w = surface.width;
        const h = surface.height;

        const base = skin.createRadialGradient(w * .32, h * .26, 0, w * .48, h * .48, Math.max(w, h) * .76);
        base.addColorStop(0, "#ffd0ba");
        base.addColorStop(.42, "#efad95");
        base.addColorStop(1, "#d88977");
        skin.fillStyle = base;
        skin.fillRect(0, 0, w, h);

        const pixels = skin.getImageData(0, 0, w, h);
        for (let i = 0; i < pixels.data.length; i += 4) {
          const grain = (random() + random() + random() - 1.5) * 7;
          pixels.data[i] = clamp(pixels.data[i] + grain, 0, 255);
          pixels.data[i + 1] = clamp(pixels.data[i + 1] + grain * .72, 0, 255);
          pixels.data[i + 2] = clamp(pixels.data[i + 2] + grain * .55, 0, 255);
        }
        skin.putImageData(pixels, 0, 0);

        skin.save();
        skin.globalCompositeOperation = "soft-light";
        for (let i = 0; i < 520; i++) {
          const x = random() * w;
          const y = random() * h;
          const r = (.35 + random() * 1.25) * scale;
          skin.fillStyle = random() > .34 ? "rgba(255,238,226,.32)" : "rgba(111,55,47,.2)";
          skin.beginPath();
          skin.ellipse(x, y, r * 1.45, r * .7, random() * Math.PI, 0, Math.PI * 2);
          skin.fill();
        }
        skin.restore();

        const sheen = skin.createLinearGradient(0, 0, w, h);
        sheen.addColorStop(0, "rgba(255,255,255,.24)");
        sheen.addColorStop(.42, "rgba(255,255,255,.02)");
        sheen.addColorStop(.76, "rgba(128,61,55,.08)");
        sheen.addColorStop(1, "rgba(255,255,255,.12)");
        skin.fillStyle = sheen;
        skin.fillRect(0, 0, w, h);
        return surface;
      }

      function captureLevelProgress() {
        const d = state.data;
        if (!state.level || !d) return null;
        const snapshot = {
          type: state.level.type,
          progress: state.progress,
          combo: state.combo,
          comboUntil: state.comboUntil,
          completed: state.completed,
          completedAt: state.completedAt,
          hasInteracted: state.hasInteracted
        };
        if (d.revealMask) snapshot.revealMask = d.revealMask;
        if (state.level.type === "care") {
          snapshot.items = d.items.map(item => ({
            done: item.done,
            progress: item.progress,
            heal: item.heal,
            charged: item.charged
          }));
          snapshot.done = d.done;
          snapshot.nextOrder = d.nextOrder;
          snapshot.swabLoad = d.swabLoad;
        } else if (state.level.type === "slice") {
          snapshot.guides = d.guides.map(guide => guide.cut);
        } else if (state.level.type === "clean") {
          snapshot.stains = d.stains.map(stain => ({ cleaned: stain.cleaned, fade: stain.fade }));
          snapshot.cleaned = d.cleaned;
        } else if (state.level.type === "pop") {
          snapshot.bubbles = d.bubbles.map(bubble => bubble.popped);
          snapshot.popped = d.popped;
        } else if (state.level.type === "sort") {
          snapshot.items = d.items.map(item => item.placed);
          snapshot.placed = d.placed;
        }
        return snapshot;
      }

      function restoreLevelProgress(snapshot) {
        const d = state.data;
        if (!snapshot || !d || snapshot.type !== state.level.type) return;
        state.progress = snapshot.progress;
        state.combo = snapshot.combo;
        state.comboUntil = snapshot.comboUntil;
        state.completed = snapshot.completed;
        state.completedAt = snapshot.completedAt;
        state.hasInteracted = snapshot.hasInteracted;
        if (snapshot.revealMask && d.revealMask) {
          const mask = d.revealMask.getContext("2d");
          mask.clearRect(0, 0, d.revealMask.width, d.revealMask.height);
          mask.globalCompositeOperation = "source-over";
          mask.drawImage(snapshot.revealMask, 0, 0, d.revealMask.width, d.revealMask.height);
          markRevealChanged(d);
        }
        if (state.level.type === "care" && snapshot.items) {
          d.items.forEach((item, index) => Object.assign(item, snapshot.items[index] || {}));
          d.done = snapshot.done;
          d.nextOrder = snapshot.nextOrder;
          d.swabLoad = snapshot.swabLoad;
          d.held = null;
          d.holdTarget = null;
        } else if (state.level.type === "slice" && snapshot.guides) {
          d.guides.forEach((guide, index) => { guide.cut = Boolean(snapshot.guides[index]); });
        } else if (state.level.type === "clean" && snapshot.stains) {
          d.stains.forEach((stain, index) => Object.assign(stain, snapshot.stains[index] || {}));
          d.cleaned = snapshot.cleaned;
        } else if (state.level.type === "pop" && snapshot.bubbles) {
          d.bubbles.forEach((bubble, index) => { bubble.popped = Boolean(snapshot.bubbles[index]); });
          d.popped = snapshot.popped;
        } else if (state.level.type === "sort" && snapshot.items) {
          d.items.forEach((item, index) => {
            item.placed = Boolean(snapshot.items[index]);
            if (item.placed) {
              item.x = item.homeX;
              item.y = item.homeY;
            }
          });
          d.placed = snapshot.placed;
          d.held = null;
        }
      }

      const interactiveOnlyStyles = new Set([
        "ear", "teeth", "tape", "screen", "noseTrim", "glassSticker",
        "teethPolish", "screenFinal", "splinter"
      ]);
      const customCareLayoutStyles = new Set([
        ...interactiveOnlyStyles, "hoof", "glass", "hoofPolish"
      ]);
      const proceduralScrubStyles = new Set(["screen", "screenFinal"]);
      const continuousScrubStyles = new Set(["hoof", "glass"]);

      function applyCareAssetLayout(level, area, items, cleanBounds) {
        const style = level.careStyle;
        if (!customCareLayoutStyles.has(style)) return;
        const assign = (item, nx, ny, extra = {}) => {
          item.x = area.x + area.w * nx;
          item.y = area.y + area.h * ny;
          item.baseX = item.x;
          item.baseY = item.y;
          Object.assign(item, extra);
        };
        const assignInBounds = (item, bounds, nx, ny, extra = {}) => {
          item.x = bounds.x + bounds.w * nx;
          item.y = bounds.y + bounds.h * ny;
          item.baseX = item.x;
          item.baseY = item.y;
          Object.assign(item, extra);
        };

        if (style === "hoof" || style === "hoofPolish") {
          const hoofPattern = [
            [.17,.14],[.32,.14],[.11,.31],[.27,.31],[.42,.31],
            [.1,.49],[.26,.49],[.42,.49],[.12,.67],[.29,.67],
            [.42,.67],[.2,.84],[.38,.84]
          ];
          items.forEach((item, index) => {
            const point = hoofPattern[Math.floor(index / 2) % hoofPattern.length];
            assign(item, index % 2 ? 1 - point[0] : point[0], point[1], {
              r: style === "hoof" ? 23 + index % 4 * 3 : 18 + index % 3 * 3,
              angle: (index % 5 - 2) * .12
            });
          });
          return;
        }

        if (style === "glass") {
          const bounds = cleanBounds || area;
          const cols = 7;
          const rows = Math.ceil(items.length / cols);
          items.forEach((item, index) => {
            const col = index % cols;
            const row = Math.floor(index / cols);
            assignInBounds(item, bounds, .035 + col / (cols - 1) * .93, .055 + row / Math.max(1, rows - 1) * .89, {
              kind: "residue",
              r: 17 + index % 3 * 3,
              angle: (index % 5 - 2) * .11
            });
          });
          return;
        }

        if (style === "tape") {
          const bounds = cleanBounds || mapCoverSourceRect(area, { x: .3, y: .26, w: .4, h: .48 });
          const cols = 5;
          const rows = Math.ceil(items.length / cols);
          items.forEach((item, index) => {
            const row = Math.floor(index / cols);
            const rowStart = row * cols;
            const rowCount = Math.min(cols, items.length - rowStart);
            const position = index - rowStart;
            const nx = rowCount === cols ? position / (cols - 1) : (position + 1) / (rowCount + 1);
            assignInBounds(item, bounds, .045 + nx * .91, .05 + row / Math.max(1, rows - 1) * .9, {
              kind: "residue",
              r: 15 + index % 3 * 3,
              angle: (index % 7 - 3) * .09
            });
          });
          return;
        }

        if (style === "teeth") {
          const perRow = Math.ceil(items.length / 2);
          items.forEach((item, index) => {
            const row = index < perRow ? 0 : 1;
            const col = index % perRow;
            assign(item, .055 + col / Math.max(1, perRow - 1) * .89, (row ? .65 : .36) + (col % 3 - 1) * .018, {
              kind: "tooth-stain",
              r: Math.min(24, Math.max(16, area.w / 23)) * (.88 + index % 4 * .06),
              angle: (col - (perRow - 1) / 2) * .025 + (index % 3 - 1) * .08
            });
          });
          return;
        }

        if (style === "screen" || style === "screenFinal") {
          const bounds = cleanBounds || mapCoverSourceRect(area, { x: .35, y: .035, w: .3, h: .92 });
          const cols = style === "screenFinal" ? 4 : 3;
          const rows = Math.ceil(items.length / cols);
          items.forEach((item, index) => {
            const col = index % cols;
            const row = Math.floor(index / cols);
            const stagger = (row % 2 ? 1 : -1) * (cols === 3 ? .035 : .022);
            assignInBounds(item, bounds, clamp(.12 + col / Math.max(1, cols - 1) * .76 + stagger, .09, .91), clamp(.1 + row / Math.max(1, rows - 1) * .8 + (col % 3 - 1) * .014, .08, .92), {
              r: 12 + index % 3 * 2,
              angle: (index % 7 - 3) * .11
            });
          });
          return;
        }

        if (style === "splinter") {
          const anchors = [[.4,.28],[.52,.24],[.61,.34],[.43,.45],[.57,.5],[.46,.63],[.59,.69]];
          items.forEach((item, index) => assign(item, ...anchors[index % anchors.length], {
            r: 19,
            angle: [-.38,.16,.42,-.2,.3,-.46,.12][index % 7],
            assetName: `splinter-${index % 3 + 1}`,
            spriteLength: index % 3 === 2 ? 94 : 82
          }));
          return;
        }

        if (style === "noseTrim") {
          const anchors = [[.34,.56],[.43,.47],[.45,.68],[.55,.68],[.57,.47],[.66,.56]];
          items.forEach((item, index) => assign(item, ...anchors[index % anchors.length], {
            r: 17,
            angle: [-.42,-.14,.22,.18,.43,-.2][index % 6],
            assetName: `nose-hair-${index % 3 + 1}`,
            spriteLength: 88
          }));
          return;
        }

        if (style === "ear") {
          const anchors = [
            [.43,.27],[.55,.25],[.67,.29],[.77,.34],
            [.4,.42],[.53,.4],[.66,.43],[.79,.47],
            [.39,.56],[.52,.55],[.65,.57],[.78,.59],
            [.44,.7],[.56,.68],[.68,.7],[.76,.73]
          ];
          items.forEach((item, index) => assign(item, ...anchors[index % anchors.length], {
            r: 19 + index % 3 * 2
          }));
          return;
        }

        if (style === "glassSticker") {
          const bounds = cleanBounds || area;
          const bx = (nx) => (bounds.x - area.x + bounds.w * nx) / area.w;
          const by = (ny) => (bounds.y - area.y + bounds.h * ny) / area.h;
          const stickerAnchors = [[.22,.2],[.76,.19],[.5,.39],[.26,.68],[.72,.7]];
          items.forEach((item, index) => {
            if (index < stickerAnchors.length) {
              const [nx, ny] = stickerAnchors[index];
              assign(item, bx(nx), by(ny), {
                kind: "sticker",
                assetName: `glass-sticker-${index + 1}`,
                r: Math.min(42, Math.max(29, bounds.w * .09)),
                angle: [-.13,.1,-.05,.08,-.09][index]
              });
            } else {
              const residueIndex = index - stickerAnchors.length;
              const col = residueIndex % 5;
              const row = Math.floor(residueIndex / 5);
              const nx = .1 + col * .2 + ((row + col) % 2 ? .025 : -.018);
              const ny = .17 + row * .25 + (col % 3 - 1) * .022;
              assign(item, bx(nx), by(ny), {
                kind: "residue",
                r: 12 + residueIndex % 3 * 2,
                angle: (residueIndex % 5 - 2) * .13
              });
            }
          });
          return;
        }

        if (style === "teethPolish") {
          items.forEach((item, index) => {
            const perRow = Math.ceil(items.length / 2);
            const row = index < perRow ? 0 : 1;
            const col = index % perRow;
            const wobble = (col % 3 - 1) * .035;
            assign(item, .18 + col / Math.max(1, perRow - 1) * .64, (row ? .68 : .37) + wobble, {
              kind: "tooth-stain",
              r: Math.min(24, Math.max(16, area.w / 22)),
              angle: (col - (perRow - 1) / 2) * .035
            });
          });
        }
      }

      function buildLevel(index, keepScene, progressSnapshot = null) {
        ensureControlAssets();
        const level = levels[index % levels.length];
        const localRound = Math.floor(index / levels.length);
        const difficulty = 1 + Math.min(1.5, index * .055);
        const random = rand(9200 + index * 73);
        state.level = level;
        state.progress = 0;
        state.combo = 1;
        state.completed = false;
        state.completedAt = 0;
        state.completionToken++;
        state.adPending = false;
        state.lastReward = 0;
        state.rewardDoubled = false;
        state.adNotice = "";
        state.adNoticeUntil = 0;
        celebrationLayer.classList.add("hidden");
        celebrationLayer.classList.remove("play");
        state.particles = [];
        state.texts = [];
        state.trails = [];
        state.lastAction = 0;
        state.hasInteracted = false;
        state.pointer.down = false;
        state.pointerId = null;
        if (!keepScene) state.scene = "play";
        prepareLevelAssets(level.index);
        invalidateVisualCaches();

        const cx = state.width / 2;
        const layout = getLayoutMetrics();
        const workY = layout.workY;
        const workW = layout.workW;

        if (level.type === "clean") {
          const w = workW;
          const h = Math.min(state.height * .38, 360);
          const rect = { x: cx - w / 2, y: workY, w, h, r: 34 };
          const count = level.count || Math.floor((56 + localRound * 6) * difficulty);
          const stains = Array.from({ length: count }, () => {
            const pad = 26;
            const style = level.cleanStyle || "mud";
            const colors = {
              mud: ["rgba(89,78,60,.46)", "rgba(43,55,57,.34)"],
              rust: ["rgba(151,93,46,.52)", "rgba(95,71,56,.42)"],
              drops: ["rgba(255,255,255,.62)", "rgba(78,133,155,.28)"],
              oil: ["rgba(39,43,40,.5)", "rgba(123,96,66,.34)"],
              dust: ["rgba(91,84,110,.38)", "rgba(160,150,130,.32)"]
            }[style] || ["rgba(89,78,60,.46)", "rgba(43,55,57,.34)"];
            return {
              x: lerp(rect.x + pad, rect.x + rect.w - pad, random()),
              y: lerp(rect.y + pad, rect.y + rect.h - pad, random()),
              size: style === "dust" ? lerp(5, 17, random()) : lerp(12, 34, random()),
              hue: random() > .5 ? colors[0] : colors[1],
              style,
              cleaned: false,
              fade: 1
            };
          });
          state.data = { rect, stains, cleaned: 0, brush: level.brush || 42, shine: 0, cleanStyle: level.cleanStyle || "mud", shape: level.shape || "case" };
        }

        if (level.type === "pop") {
          const cols = state.width < 380 ? Math.min(5, level.cols || 5) : (level.cols || 6);
          const radius = Math.min(29, (state.width - 74) / (cols * 2));
          const gap = radius * 2 + 9;
          const rows = level.rows || Math.max(5, Math.floor((state.height * .47) / gap));
          const startX = cx - ((cols - 1) * gap) / 2;
          const startY = workY + 28;
          const bubbles = [];
          for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
              const jitterX = (random() - .5) * 7;
              const jitterY = (random() - .5) * 7;
              bubbles.push({
                x: startX + x * gap + jitterX,
                y: startY + y * gap + jitterY,
                r: radius * lerp(.82, 1.18, random()),
                popped: false,
                pulse: random() * Math.PI * 2,
                special: random() > .88,
                style: level.popStyle || "round"
              });
            }
          }
          state.data = { bubbles, popped: 0, total: bubbles.length, popStyle: level.popStyle || "round" };
        }

        if (level.type === "slice") {
          const w = workW;
          const y = workY + (state.compactLandscape ? 0 : Math.min(24, state.height * .035));
          const availableH = state.height - y - layout.bottomReserved;
          const h = Math.min(430, state.height * (state.compactLandscape ? .62 : .5), Math.max(150, availableH));
          const rect = { x: cx - w / 2, y, w, h, r: state.compactLandscape ? 18 : 26 };
          const goal = level.goal || 8;
          const guides = Array.from({ length: goal }, (_, i) => {
            const t = (i + 1) / (goal + 1);
            if (level.sliceStyle === "diagonal") return { x1: rect.x + rect.w * .16, y1: rect.y + rect.h * t, x2: rect.x + rect.w * .84, y2: rect.y + rect.h * (1 - t), cut: false };
            if (level.sliceStyle === "grid") {
              const vertical = i % 2 === 0;
              const p = (Math.floor(i / 2) + 1) / (Math.ceil(goal / 2) + 1);
              return vertical
                ? { x1: rect.x + rect.w * p, y1: rect.y + rect.h * .12, x2: rect.x + rect.w * p, y2: rect.y + rect.h * .88, cut: false }
                : { x1: rect.x + rect.w * .12, y1: rect.y + rect.h * p, x2: rect.x + rect.w * .88, y2: rect.y + rect.h * p, cut: false };
            }
            if (level.sliceStyle === "glass") {
              const vertical = i % 3 === 0;
              const p = (i + 1) / (goal + 1);
              return vertical
                ? { x1: rect.x + rect.w * p, y1: rect.y + rect.h * .14, x2: rect.x + rect.w * p, y2: rect.y + rect.h * .86, cut: false }
                : { x1: rect.x + rect.w * .1, y1: rect.y + rect.h * p, x2: rect.x + rect.w * .9, y2: rect.y + rect.h * p, cut: false };
            }
            if (level.sliceStyle === "puzzleGlass") {
              const p = (i + 1) / (goal + 1);
              if (i % 2 === 0) return { x1: rect.x + rect.w * .12, y1: rect.y + rect.h * p, x2: rect.x + rect.w * .88, y2: rect.y + rect.h * (.18 + ((i * 3) % 7) / 9), cut: false };
              return { x1: rect.x + rect.w * p, y1: rect.y + rect.h * .1, x2: rect.x + rect.w * (1 - p * .55), y2: rect.y + rect.h * .9, cut: false };
            }
            if (level.sliceStyle === "wave") return { x1: rect.x + rect.w * .1, y1: rect.y + rect.h * t, x2: rect.x + rect.w * .9, y2: rect.y + rect.h * (t + Math.sin(i) * .08), cut: false };
            if (level.sliceStyle === "snow") return { x1: rect.x + rect.w * t, y1: rect.y + rect.h * .08, x2: rect.x + rect.w * (1 - t), y2: rect.y + rect.h * .92, cut: false };
            return { x1: rect.x + rect.w * .1, y1: rect.y + rect.h * t, x2: rect.x + rect.w * .9, y2: rect.y + rect.h * t, cut: false };
          });
          state.data = {
            rect,
            area: rect,
            cuts: [],
            goal,
            guides,
            trail: [],
            wobble: 0,
            shavings: [],
            ...createRevealLayer(rect)
          };
        }

        if (level.type === "sort") {
          const itemCount = state.width < 390 ? Math.min(5, level.items || 5) : (level.items || 6);
          const areaW = Math.min(state.width - 44, 420);
          const slotSize = Math.min(70, (areaW - 22) / 3);
          const slots = [];
          const slotTop = workY + 12;
          for (let i = 0; i < itemCount; i++) {
            const col = i % 3;
            const row = Math.floor(i / 3);
            slots.push({
              x: cx - areaW / 2 + col * (slotSize + 11),
              y: slotTop + row * (slotSize + 12),
              w: slotSize,
              h: slotSize
            });
          }
          const colors = ["#ff8b7b", "#a7ddd0", "#ffc857", "#7a5c9d", "#65bfc1", "#f0a6ca"];
          const startCols = 3;
          const startGap = 13;
          const startW = startCols * slotSize + (startCols - 1) * startGap;
          const startX = cx - startW / 2;
          const startY = Math.min(state.height - 205, Math.max(workY + 220, state.height * .61));
          const startPositions = slots.map((_, i) => ({
            x: startX + (i % startCols) * (slotSize + startGap),
            y: startY + Math.floor(i / startCols) * (slotSize + startGap)
          }));
          for (let i = startPositions.length - 1; i > 0; i--) {
            const j = Math.floor(random() * (i + 1));
            [startPositions[i], startPositions[j]] = [startPositions[j], startPositions[i]];
          }
          const items = slots.map((slot, i) => ({
            x: startPositions[i].x,
            y: startPositions[i].y,
            homeX: slot.x,
            homeY: slot.y,
            w: slot.w,
            h: slot.h,
            color: colors[i % colors.length],
            shape: i % 4,
            placed: false,
            grab: false,
            offsetX: 0,
            offsetY: 0,
            angle: lerp(-.22, .22, random())
          }));
          state.data = { slots, items, placed: 0, held: null };
        }

        if (level.type === "care") {
          const w = Math.min(workW, 520);
          const y = workY - (state.compactLandscape ? 0 : 6);
          const availableH = state.height - y - layout.bottomReserved;
          const h = Math.min(state.height * (state.compactLandscape ? .64 : .64), 570, Math.max(150, availableH));
          const area = { x: cx - w / 2, y, w, h, r: state.compactLandscape ? 18 : 26 };
          const count = level.count || 12;
          const cols = level.interaction === "pluck" ? Math.min(4, count) : Math.ceil(Math.sqrt(count * 1.15));
          const rows = Math.ceil(count / cols);
          const items = [];
          for (let i = 0; i < count; i++) {
            const col = i % cols;
            const row = Math.floor(i / cols);
            const insetX = level.careStyle === "hoof" ? .14 : level.careStyle.includes("hoof") ? .28 : .18;
            const insetY = level.careStyle === "hoof" ? .12 : level.careStyle.includes("hoof") ? .18 : .22;
            let x = lerp(area.x + area.w * insetX, area.x + area.w * (1 - insetX), cols === 1 ? .5 : col / (cols - 1));
            const hoofBottom = level.careStyle === "hoof" ? .76 : .86;
            let y = lerp(area.y + area.h * insetY, area.y + area.h * (level.careStyle.includes("hoof") ? hoofBottom : .78), rows === 1 ? .5 : row / (rows - 1));
            if (level.careStyle === "hoof") {
              const t = random();
              const side = i % 2 ? 1 : -1;
              const outer = lerp(.36, .25, Math.max(0, (t - .5) * 2));
              x = area.x + area.w * (.5 + side * lerp(.1, outer, random()));
              y = area.y + area.h * lerp(.09, .72, t);
            } else if (level.careStyle === "pimple" || level.careStyle === "pimpleMask") {
              x = area.x + area.w * lerp(.31, .69, random());
              y = area.y + area.h * lerp(.24, .7, random());
            } else if (level.careStyle.includes("nose")) {
              const side = i % 2;
              const sideIndex = Math.floor(i / 2);
              const perSide = Math.ceil(count / 2);
              const spread = Math.min(144, Math.max(82, area.h * .37));
              x = area.x + area.w * (side ? .64 : .36) + (random() - .5) * 5;
              y = area.y + area.h * .6 - spread / 2 + (perSide <= 1 ? spread / 2 : sideIndex * spread / (perSide - 1));
            } else if (level.ordered) {
              const orderedCols = count > 9 ? 4 : 3;
              const orderedRows = Math.ceil(count / orderedCols);
              const orderedCol = i % orderedCols;
              const orderedRow = Math.floor(i / orderedCols);
              x = area.x + area.w * lerp(.3, .7, orderedCols === 1 ? .5 : orderedCol / (orderedCols - 1));
              y = area.y + area.h * lerp(.3, .7, orderedRows === 1 ? .5 : orderedRow / (orderedRows - 1));
            } else if (level.careStyle === "wound" || level.careStyle === "woundBandage") {
              x = area.x + area.w * lerp(.39, .61, random());
              y = area.y + area.h * lerp(.38, .63, random());
            } else if (level.careStyle === "splinter") {
              x = area.x + area.w * lerp(.34, .66, random());
              y = area.y + area.h * lerp(.22, .74, random());
            }
            const jitter = level.careStyle.includes("nose") ? 0 : level.ordered ? 4 : level.interaction === "pluck" ? 10 : 18;
            const finalX = x + (random() - .5) * jitter;
            const finalY = y + (random() - .5) * jitter;
            items.push({
              x: finalX,
              y: finalY,
              baseX: finalX,
              baseY: finalY,
              r: level.careStyle === "hoof" ? lerp(29, 45, random()) : level.careStyle.includes("nose") ? lerp(12, 15, random()) : level.interaction === "hold" ? lerp(17, 24, random()) : lerp(12, 22, random()),
              angle: lerp(-.55, .55, random()),
              order: i,
              progress: 0,
              done: false,
              held: false,
              offsetX: 0,
              offsetY: 0,
              color: random() > .5 ? level.accent : "#fff7de"
            });
          }
          let cleanBounds = null;
          let protectedEdges = null;
          let cleanRegions = null;
          if (level.careStyle.includes("glass")) {
            const wideScene = area.w / area.h > 1.2;
            protectedEdges = level.careStyle === "glassSticker"
              ? { left: wideScene ? .15 : .015, right: wideScene ? .15 : .015, top: .075, bottom: wideScene ? .065 : .09 }
              : { left: wideScene ? .045 : .015, right: wideScene ? .045 : .015, top: wideScene ? .035 : .065, bottom: wideScene ? .04 : .115 };
            cleanBounds = {
              x: area.x + area.w * protectedEdges.left,
              y: area.y + area.h * protectedEdges.top,
              w: area.w * (1 - protectedEdges.left - protectedEdges.right),
              h: area.h * (1 - protectedEdges.top - protectedEdges.bottom)
            };
          } else if (level.careStyle === "tape") {
            cleanBounds = mapCoverSourceRect(area, { x: .29, y: .24, w: .42, h: .52 });
          } else if (level.careStyle.includes("teeth")) {
            cleanBounds = {
              x: area.x + area.w * .025,
              y: area.y + area.h * .2,
              w: area.w * .95,
              h: area.h * .58,
              r: 12
            };
          } else if (level.careStyle.includes("screen")) {
            cleanBounds = mapCoverSourceRect(area, { x: .345, y: .025, w: .31, h: .94 });
          } else if (level.careStyle.includes("hoof")) {
            cleanRegions = [
              { x: area.x + area.w * .015, y: area.y + area.h * .105, w: area.w * .47, h: area.h * .84 },
              { x: area.x + area.w * .515, y: area.y + area.h * .105, w: area.w * .47, h: area.h * .84 }
            ];
          }
          applyCareAssetLayout(level, area, items, cleanBounds);
          state.data = {
            area,
            items,
            done: 0,
            held: null,
            holdTarget: null,
            interaction: level.interaction,
            careStyle: level.careStyle,
            scrubAxis: level.scrubAxis || null,
            ordered: Boolean(level.ordered),
            nextOrder: 0,
            brush: level.interaction === "scrub"
              ? (level.careStyle.includes("hoof") ? (coarsePointer ? 54 : 50) : (coarsePointer ? 44 : 42))
              : 30,
            swabLoad: 0,
            extractionPulse: 0,
            cleanBounds,
            cleanRegions,
            protectedEdges,
            ...createRevealLayer(area)
          };

          if (level.careStyle === "pimple") {
            for (const item of items) {
              item.r = lerp(11, 15, random());
              item.pore = lerp(1.8, 3.1, random());
              item.coreLength = lerp(13, 21, random());
              item.heal = 0;
              item.extracting = false;
            }
          }
          prepareInteractiveAssets(level.careStyle, "high");
        }

        restoreLevelProgress(progressSnapshot);
        ensureToolAsset(getActiveToolKey(), "high");
        setTool(level);
        updateHud();
        if (state.levelIndex > 0) tapAds.preload("skipLevel");
        scheduleIdlePreload(level.index + 1);
        placeGesture();
      }

      function setTool(level) {
        updateToolPreview();
      }

      function getActiveToolName() {
        const index = state.level?.index ?? state.levelIndex;
        if (index === 6) return state.progress < .16 ? "清洁喷壶" : "刮水器";
        if (index === 5) {
          if (state.progress < .14) return "清洁喷壶";
          return state.progress < .62 ? "除胶刮片" : "刮水器";
        }
        return state.level?.tool || modeNames[state.level?.type] || "护理工具";
      }

      function updateToolPreview() {
        if (!state.level) return;
        const key = getActiveToolKey();
        ensureToolAsset(key);
        if (toolImageEl.dataset.tool !== key) {
          toolImageEl.dataset.tool = key;
          toolImageEl.src = `assets/tools/tool-${key}.webp`;
          const tallTools = ["cotton-swab", "hoof-scraper", "rounded-tweezers", "care-tweezers", "ear-pick", "glass-cutter", "keyboard-vacuum", "tooth-polisher", "adhesive-scraper", "spray-bottle"];
          const wideTools = ["squeegee", "screen-scraper"];
          const roundTools = ["cotton-pad", "bandage", "nose-scissors"];
          toolImageEl.className = `tool-preview${tallTools.includes(key) ? " is-tall" : wideTools.includes(key) ? " is-wide" : roundTools.includes(key) ? " is-round" : ""}`;
        }
        toolNameEl.textContent = getActiveToolName();
      }

      function showAdNotice(message, duration = 2200) {
        state.adNotice = message;
        state.adNoticeUntil = performance.now() + duration;
        state.hudSignature = "";
        updateHud();
      }

      function compactAdErrorText(result) {
        if (!result || typeof result !== "object") return "";
        const code = Number(result.errorCode) || 0;
        const message = String(result.errorMessage || "").replace(/\s+/g, " ").trim();
        if (code) return `错误码 ${code}`;
        if (!message) return "";
        return message.length > 26 ? `${message.slice(0, 26)}...` : message;
      }

      function getAdFailureMessage(reason) {
        const code = typeof reason === "object" ? Number(reason.errorCode) : 0;
        const reasonKey = typeof reason === "object" ? reason.reason : reason;
        if (code === 1001 || code === 1002) return "广告位 ID 无效，请检查后台配置";
        if (code === 1004) return "当前暂无可用广告，请稍后再试";
        if (code === 1005) return "广告位正在审核中，暂时无法播放";
        if (code === 1006) return "广告位审核未通过，暂时无法播放";
        if (code === 1007) return "广告能力已被限制，请检查后台状态";
        if (code === 1008) return "广告位已关闭，请在后台重新开启";
        if (code === 3100) return "广告测试环境未匹配，请检查测试设备和平台";
        if (code === 1000 || code === 1003) return "广告服务暂时异常，请稍后再试";
        switch (reasonKey) {
          case "sdk_not_ready":
            return "广告 SDK 正在启动，请稍后再试";
          case "missing_ad_unit_id":
            return "广告位未配置，请重新上传测试包";
          case "create_failed":
            return "广告组件创建失败，请重新进入游戏";
          case "ad_error":
          case "load_or_show_failed": {
            const detail = compactAdErrorText(reason);
            return detail
              ? `广告加载失败：${detail}`
              : "广告加载失败，请检查网络或广告位状态";
          }
          case "timeout":
            return "广告响应超时，请稍后再试";
          case "already_pending":
            return "广告正在处理中，请稍候";
          default:
            if (typeof reason === "object") {
              const detail = compactAdErrorText(reason);
              return detail ? `广告暂不可用：${detail}` : "广告暂不可用，请稍后再试";
            }
            return "广告暂不可用，请稍后再试";
        }
      }

      function adsAllowedForCurrentProgress() {
        return true;
      }

      function resetInputAfterAd() {
        state.pointer.down = false;
        state.pointerId = null;
        state.pointer.handleMode = false;
        state.pointer.reach = 0;
        stopToolLoop();
      }

      function runRewardedAction(slot, onReward) {
        if (state.adPending) return false;

        // Keep local browser preview convenient while requiring real ads on TapTap.
        if (!tapAds.isTapRuntime()) {
          onReward();
          return true;
        }
        if (!adsAllowedForCurrentProgress()) {
          showAdNotice("当前暂不可用，请稍后再试");
          return false;
        }
        if (!tapAds.canUse(slot)) {
          showAdNotice(getAdFailureMessage(tapAds.getStatus(slot)));
          return false;
        }

        resetInputAfterAd();
        state.adPending = true;
